<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<title>SEC BM Game · Permainan Bahasa Melayu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--mint:#D4F4E8;--teal:#14524F;--teal-soft:#2E7B76;--pink:#FF8FA8;--pink-soft:#FFE1E8;--sun:#FFD25E}
*{box-sizing:border-box}
body{margin:0;font-family:'Waknan','Baloo 2','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;color:var(--teal);background:var(--mint);
background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:32px 32px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:2.2rem;line-height:1.05;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--teal-soft);font-weight:700;margin-bottom:22px}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--teal);border-radius:20px;padding:14px;box-shadow:0 6px 0 var(--teal);margin-bottom:18px}
a.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal)}
.ic{font-size:2.6rem;width:64px;height:64px;flex:none;display:grid;place-items:center;background:var(--pink-soft);border-radius:16px}
.card b{display:block;font-size:1.25rem}
.card span{font-size:.92rem;color:var(--teal-soft)}
.go{margin-left:auto;background:var(--sun);border:2px solid var(--teal);border-radius:999px;padding:4px 12px;font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 SEC BM Game</h1>
  <div class="sub">Permainan Bahasa Melayu · 选一个游戏开始玩！</div>
  <a class="card" href="klinik-dr-bahasa.html">
    <div class="ic">🩺</div>
    <div><b>Klinik Dr. Bahasa</b><span>Gaya Bahasa · Tingkatan 1 · 语言诊所</span></div>
    <div class="go">Main ➜</div>
  </a>
<a class="card" href="larian-bendang-penyuntingan.html">
<div class="ic">🌾</div>
<div><b>Larian Bendang</b><span>Penyuntingan · Tingkatan 5 · 稻田赛跑找错改错</span></div>
<div class="go">Main ➜</div>
</a>

</div>
</body>
</html>
