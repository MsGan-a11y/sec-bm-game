var PAGES = {"index": "<!DOCTYPE html>\n<html lang=\"ms\">\n<head>\n<script>@@codegs.js@@<\/script>\n__INJECT__\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;\n  var m = a.getAttribute('href').match(/^([\\w-]+)\\.html(\\?.*)?$/);\n  if (m) { e.preventDefault(); parent.postMessage({ arkedGo: m[1], q: m[2] || '' }, '*'); }\n}, true);\n<\/script>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Arked Ujian — Guru<\/title>\n<style>@@ujian.css@@<\/style>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js\"><\/script>\n<script>@@core.js@@<\/script>\n<script>@@themes.js@@<\/script>\n<script>@@importer.js@@<\/script>\n<style>\n  .wrap{max-width:1150px}\n  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 16px}\n  header h1{margin:0;font-size:34px;line-height:1}\n  header h1 b{color:var(--gold)}\n  header .sp{flex:1}\n  .tabs{display:flex;gap:8px;flex-wrap:wrap}\n  .tabs .btn.on{background:var(--gold);color:#2a1d00}\n  .card+.card{margin-top:14px}\n  h2{margin:0 0 10px;font-size:24px}\n  h3{margin:14px 0 6px;font-size:18px}\n  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n  .in{font-family:inherit;font-size:17px;font-weight:600;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#1a2040;min-width:0}\n  .grow{flex:1}\n  .chips{display:flex;gap:8px;flex-wrap:wrap}\n  .chip{background:var(--panel2);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:6px 14px;font-weight:800;font-size:16px}\n  .chip.on{border-color:var(--gold);background:#ffc93c26}\n  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}\n  .tcard{background:var(--panel);border:3px solid transparent;border-radius:18px;padding:12px;text-align:left;color:var(--ink);transition:transform .15s}\n  .tcard:hover{transform:translateY(-3px)}\n  .tcard.on{border-color:var(--gold);background:#ffc93c1f}\n  .tcard .e{font-size:44px;line-height:1}\n  .tcard b{display:block;font-size:19px;margin-top:4px}\n  .tcard small{color:var(--muted);font-size:13px;line-height:1.3;display:block}\n  .drop{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;cursor:pointer;color:var(--muted)}\n  .drop.over{border-color:var(--gold);color:var(--ink)}\n  .ok{color:var(--green);font-weight:700}\n  table{width:100%;border-collapse:collapse;font-size:16px}\n  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}\n  th{color:var(--muted);font-size:14px;cursor:pointer;white-space:nowrap;user-select:none}\n  tr:hover td{background:#ffffff08}\n  .pill{display:inline-block;border-radius:99px;padding:0 10px;font-size:13px;font-weight:800}\n  .pill.open{background:#3ddc8433;color:var(--green)}.pill.closed{background:#ff6b6b33;color:var(--red)}\n  .pill.wait{background:#ffc93c33;color:var(--gold)}\n  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}\n  .stat{background:var(--panel);border-radius:16px;padding:10px 14px}\n  .stat b{display:block;font-size:30px;line-height:1.1}\n  .stat span{color:var(--muted);font-size:14px}\n  .qbar{height:12px;background:#0006;border-radius:99px;overflow:hidden;min-width:90px}\n  .qbar i{display:block;height:100%}\n  .matrix td,.matrix th{text-align:center;padding:4px 5px;font-size:14px}\n  .matrix td:first-child,.matrix th:first-child{text-align:left;white-space:nowrap}\n  .scroll{overflow-x:auto}\n  .linkbox{display:flex;gap:16px;flex-wrap:wrap;align-items:center}\n  .linkbox .qr{background:#fff;padding:10px;border-radius:14px}\n  .url{word-break:break-all;font-weight:700;background:#0006;padding:8px 12px;border-radius:12px;font-size:15px}\n  textarea.code{width:100%;height:160px;font-family:ui-monospace,monospace;font-size:12px;border-radius:12px;padding:10px;background:#0b0f20;color:#cfe3ff;border:1px solid var(--line)}\n  ol.steps li{margin:6px 0}\n  .xs{font-size:13px}\n  .danger{color:var(--red)}\n  details summary{cursor:pointer;font-weight:800;font-size:18px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header><div style=\"font-size:48px\">🎮<\/div><h1>Arked <b>Ujian<\/b><div class=\"muted\" style=\"font-size:16px;font-weight:600\">Ujian output melalui permainan<\/div><\/h1>\n    <div class=\"sp\"><\/div><div class=\"tabs\" id=\"tabs\"><\/div><\/header>\n  <div id=\"main\"><\/div>\n<\/div>\n<script>\nconst { $, $$, esc, fmt, h, store, mmss, call } = U;\nlet cfg = store.get('au_cfg', {});        // {ref, key}\nlet view = cfg.ref ? 'tests' : 'setup', curTest = null, R = null, sortBy = 'name', clsFilter = '';\nconst THEME_KEYS = Object.keys(THEMES);\nconst studentLink = id => window.__SELF ? `${window.__SELF}#play?t=${id}&s=${encodeURIComponent(cfg.ref)}` : new URL(`play.html?t=${id}&s=${encodeURIComponent(cfg.ref)}`, location.href).href;\nconst toast = (msg) => { const t = h(`<div class=\"modal\" style=\"background:transparent;pointer-events:none;align-items:flex-start;padding-top:20px\"><div class=\"card\" style=\"max-width:none;width:auto;background:#000d\">${msg}<\/div><\/div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 1800); };\nconst api = (a, d = {}) => call(cfg.ref, a, Object.assign({ key: cfg.key }, d));\n\nfunction nav() {\n  $('#tabs').innerHTML = cfg.ref ? [['tests', '📚 Ujian Saya'], ['create', '➕ Cipta Ujian'], ['setup', '⚙️ Tetapan']].map(([k, l]) => `<button class=\"btn ${view === k || (view === 'results' && k === 'tests') ? 'on' : ''}\" data-v=\"${k}\">${l}<\/button>`).join('') : '';\n  $$('#tabs .btn').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });\n}\nfunction render() { nav(); ({ setup, create, tests, results })[view](); scrollTo(0, 0); }\n\n// ---------------- setup ----------------\nasync function codeText() { if (window.__CODE_GS) return window.__CODE_GS; try { return await (await fetch('apps-script/Code.gs')).text(); } catch (e) { return '// Kod tidak dapat dimuatkan'; } }\nasync function setup() {\n  $('#main').innerHTML = `<div class=\"card\"><h2>⚙️ Sambung ke Google Sheet anda<\/h2>\n    <p class=\"muted\">Semua ujian dan markah murid disimpan dalam Google Sheet milik anda sendiri. Pasang sekali sahaja (±5 minit).<\/p>\n    <details ${cfg.ref ? '' : 'open'}><summary>📖 Cara pasang (sekali sahaja)<\/summary>\n    <ol class=\"steps\">\n      <li>Buka <a href=\"https://sheets.new\" target=\"_blank\" style=\"color:var(--gold)\">sheets.new<\/a> → namakan Sheet (cth: <b>Arked Ujian<\/b>).<\/li>\n      <li>Menu <b>Extensions → Apps Script<\/b>. Padam semua kod di situ.<\/li>\n      <li>Klik <b>Salin kod<\/b> di bawah, tampal ke Apps Script. <b>Tukar<\/b> <code>TEACHER_KEY<\/code> kepada kata laluan anda sendiri. Klik 💾 Save.<\/li>\n      <li><b>Deploy → New deployment<\/b> → ⚙️ pilih <b>Web app<\/b>. Execute as: <b>Me<\/b>. Who has access: <b>Anyone<\/b>. Klik <b>Deploy<\/b> → <b>Authorize access<\/b> → pilih akaun → <i>Advanced → Go to … (unsafe)<\/i> → <b>Allow<\/b>.<\/li>\n      <li>Salin <b>Web app URL<\/b> (berakhir dengan <code>/exec<\/code>) dan tampal di bawah bersama kata laluan tadi.<\/li>\n    <\/ol>\n    <textarea class=\"code\" id=\"code\" readonly>Memuatkan…<\/textarea>\n    <div class=\"row\" style=\"margin-top:6px\"><button class=\"btn\" id=\"cp\">📋 Salin kod<\/button><\/div><\/details>\n    <h3>Web app URL<\/h3><input class=\"in\" id=\"ref\" style=\"width:100%\" placeholder=\"https://script.google.com/macros/s/…/exec\" value=\"${esc(cfg.ref ? U.scriptUrl(cfg.ref) : '')}\">\n    <h3>Kata laluan guru (TEACHER_KEY)<\/h3><input class=\"in\" id=\"key\" type=\"password\" style=\"width:100%\" value=\"${esc(cfg.key || '')}\">\n    <div class=\"row\" style=\"margin-top:14px\"><button class=\"btn gold big\" id=\"sv\">Simpan & Uji Sambungan<\/button><span id=\"st\"><\/span><\/div><\/div>`;\n  $('#code').value = await codeText();\n  $('#cp').onclick = async () => { $('#code').select(); try { await navigator.clipboard.writeText($('#code').value); } catch (e) { document.execCommand('copy'); } toast('📋 Kod disalin'); };\n  $('#sv').onclick = async () => {\n    const ref = U.scriptRef($('#ref').value), key = $('#key').value;\n    $('#st').innerHTML = '<span class=\"spin\">⏳<\/span> Menguji…';\n    try { const r = await call(ref, 'ping', { key }); cfg = { ref, key }; store.set('au_cfg', cfg); $('#st').innerHTML = `<span class=\"ok\">✅ Bersambung ke \"${esc(r.sheet)}\"<\/span>`; setTimeout(() => { view = 'tests'; render(); }, 900); }\n    catch (e) { $('#st').innerHTML = `<span class=\"err\">⚠ ${esc(e.message)}<\/span>`; }\n  };\n}\n\n// ---------------- create ----------------\nlet draft = { title: '', time: 20, theme: 'space', qs: null, file: '' };\nfunction create() {\n  $('#main').innerHTML = `<div class=\"card\"><h2>➕ Cipta ujian baharu<\/h2>\n    <h3>1. Tajuk ujian<\/h3><input class=\"in\" id=\"ti\" style=\"width:100%\" maxlength=\"120\" placeholder=\"cth: F3 BI Reunion — Output Test\" value=\"${esc(draft.title)}\">\n    <h3>2. Fail soalan (.xlsx / .csv — format BlastRoom, Blooket atau Kahoot)<\/h3>\n    <label class=\"drop\" id=\"drop\">📂 <b>Seret fail ke sini<\/b> atau klik untuk pilih<input type=\"file\" id=\"fi\" accept=\".xlsx,.xls,.csv\" hidden><\/label>\n    <div id=\"qinfo\" style=\"margin-top:6px\">${draft.qs ? qinfo() : ''}<\/div>\n    <h3>3. Had masa (seluruh ujian)<\/h3>\n    <div class=\"chips\" id=\"tm\">${[0, 10, 15, 20, 30, 45, 60].map(v => `<button class=\"chip\" data-v=\"${v}\">${v ? v + ' minit' : 'Tiada had'}<\/button>`).join('')}\n      <input class=\"in\" id=\"tmc\" type=\"number\" min=\"1\" max=\"300\" placeholder=\"lain\" style=\"width:90px\"><\/div>\n    <h3>4. Pilih permainan<\/h3>\n    <div class=\"themes\">${THEME_KEYS.map(k => `<button class=\"tcard\" data-k=\"${k}\"><span class=\"e\">${THEMES[k].emoji}<\/span><b>${THEMES[k].name}<\/b><small>${THEMES[k].tagline}<\/small><\/button>`).join('')}<\/div>\n    <p class=\"muted xs\">Peraturan untuk semua permainan: soalan & pilihan dirawakkan, satu percubaan sahaja, betul/salah hanya didedahkan selepas hantar.<\/p>\n    <div class=\"row\" style=\"justify-content:flex-end;margin-top:10px\"><span id=\"cst\"><\/span><button class=\"btn gold big\" id=\"mk\">Cipta Ujian 🚀<\/button><\/div><\/div>`;\n  const paintT = () => { $$('#tm .chip').forEach(c => c.classList.toggle('on', +c.dataset.v === draft.time)); };\n  $$('#tm .chip').forEach(c => c.onclick = () => { draft.time = +c.dataset.v; $('#tmc').value = ''; paintT(); });\n  $('#tmc').oninput = e => { draft.time = Math.max(0, +e.target.value || 0); paintT(); };\n  paintT();\n  const paintTh = () => $$('.tcard').forEach(c => c.classList.toggle('on', c.dataset.k === draft.theme));\n  $$('.tcard').forEach(c => c.onclick = () => { draft.theme = c.dataset.k; paintTh(); U.sfx.pick(); }); paintTh();\n  $('#ti').oninput = e => draft.title = e.target.value;\n  const handle = async f => {\n    try { const r = await Importer.read(f); draft.qs = r.questions; draft.file = f.name; draft.skipped = r.skipped;\n      if (!draft.title) { draft.title = f.name.replace(/\\.(xlsx|xls|csv)$/i, '').replace(/_/g, ' '); $('#ti').value = draft.title; }\n      $('#qinfo').innerHTML = qinfo(); }\n    catch (e) { $('#qinfo').innerHTML = `<span class=\"err\">⚠ ${esc(e.message)}<\/span>`; }\n  };\n  $('#fi').onchange = e => e.target.files[0] && handle(e.target.files[0]);\n  const d = $('#drop'); d.ondragover = e => { e.preventDefault(); d.classList.add('over'); }; d.ondragleave = () => d.classList.remove('over');\n  d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); e.dataTransfer.files[0] && handle(e.dataTransfer.files[0]); };\n  $('#mk').onclick = async () => {\n    if (!draft.title.trim()) return $('#cst').innerHTML = '<span class=\"err\">Tulis tajuk ujian<\/span>';\n    if (!draft.qs) return $('#cst').innerHTML = '<span class=\"err\">Muat naik fail soalan<\/span>';\n    $('#mk').disabled = true; $('#cst').innerHTML = '<span class=\"spin\">⏳<\/span> ';\n    try {\n      const r = await api('createTest', { title: draft.title.trim(), theme: draft.theme, timeLimitMin: draft.time, questions: draft.qs.map(q => ({ q: q.q, correct: q.correct, wrong: q.wrong })) });\n      const id = r.testId; draft = { title: '', time: 20, theme: draft.theme, qs: null };\n      showLink({ testId: id, title: r.title }, true);\n    } catch (e) { $('#cst').innerHTML = `<span class=\"err\">⚠ ${esc(e.message)}<\/span>`; $('#mk').disabled = false; }\n  };\n}\nfunction qinfo() {\n  const mcq = draft.qs.filter(q => q.wrong.length).length;\n  return `<span class=\"ok\">✅ ${esc(draft.file)}: ${draft.qs.length} soalan<\/span> <span class=\"muted\">(${mcq} aneka pilihan, ${draft.qs.length - mcq} isi tempat kosong${draft.skipped ? `, ${draft.skipped} baris dilangkau` : ''})<\/span>`;\n}\nfunction showLink(t, fresh) {\n  const url = studentLink(t.testId);\n  const m = h(`<div class=\"modal\"><div class=\"card\" style=\"max-width:640px\">\n    <h2>${fresh ? '🎉 Ujian dicipta!' : '🔗 Pautan murid'}<\/h2>\n    <div class=\"linkbox\" style=\"justify-content:center\"><div class=\"qr\" id=\"qr\"><\/div>\n      <div style=\"flex:1;min-width:220px;text-align:left\"><div class=\"muted\">Kod ujian<\/div><div style=\"font-size:34px;font-weight:800;color:var(--gold);letter-spacing:3px\">${t.testId}<\/div>\n      <div class=\"url\" id=\"u\">${esc(url)}<\/div>\n      <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn gold\" id=\"cpl\">📋 Salin pautan<\/button><a class=\"btn\" href=\"${esc(url)}\" target=\"_blank\">↗ Cuba<\/a><\/div><\/div><\/div>\n    <p class=\"muted xs\">Hantar pautan ini ke kumpulan WhatsApp / Google Classroom. Murid boleh buat bila-bila masa sehingga anda tutup ujian.<\/p>\n    <button class=\"btn\" id=\"cl\">Tutup<\/button><\/div><\/div>`);\n  document.body.appendChild(m);\n  try { new QRCode(m.querySelector('#qr'), { text: url, width: 170, height: 170 }); } catch (e) { m.querySelector('#qr').remove(); }\n  m.querySelector('#cpl').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('📋 Pautan disalin'); } catch (e) { toast('Salin secara manual'); } };\n  m.querySelector('#cl').onclick = () => { m.remove(); if (fresh) { view = 'tests'; render(); } };\n}\n\n// ---------------- tests list ----------------\nasync function tests() {\n  $('#main').innerHTML = `<div class=\"card\"><h2>📚 Ujian Saya<\/h2><div id=\"tl\"><span class=\"spin\">⏳<\/span> Memuatkan…<\/div><\/div>`;\n  let r; try { r = await api('listTests'); } catch (e) { return $('#tl').innerHTML = `<p class=\"err\">⚠ ${esc(e.message)}<\/p><button class=\"btn\" onclick=\"view='setup';render()\">⚙️ Semak tetapan<\/button>`; }\n  if (!r.tests.length) return $('#tl').innerHTML = `<p class=\"muted\">Belum ada ujian.<\/p><button class=\"btn gold\" onclick=\"view='create';render()\">➕ Cipta ujian pertama<\/button>`;\n  $('#tl').innerHTML = `<div class=\"scroll\"><table><tr><th>Ujian<\/th><th>Kod<\/th><th>Permainan<\/th><th>Masa<\/th><th>Dihantar<\/th><th>Status<\/th><th><\/th><\/tr>\n    ${r.tests.map(t => `<tr><td><b>${esc(t.title)}<\/b><div class=\"muted xs\">${new Date(t.createdAt).toLocaleDateString('ms-MY')} · ${t.nQ} soalan<\/div><\/td>\n      <td><b>${t.testId}<\/b><\/td><td>${THEMES[t.theme] ? THEMES[t.theme].emoji + ' ' + THEMES[t.theme].name : t.theme}<\/td>\n      <td>${t.timeLimitMin ? t.timeLimitMin + ' min' : '—'}<\/td><td><b>${t.submitted}<\/b> murid<\/td>\n      <td><button class=\"pill ${t.status}\" data-st=\"${t.testId}\" data-s=\"${t.status}\" title=\"Klik untuk tukar\">${t.status === 'open' ? '🟢 Dibuka' : '🔴 Ditutup'}<\/button><\/td>\n      <td class=\"row\" style=\"flex-wrap:nowrap\"><button class=\"btn\" data-ln=\"${t.testId}\">🔗<\/button><button class=\"btn gold\" data-rs=\ \/div>\n    <div class=\"stats\">\n      <div class=\"stat\"><b>${done.length}<\/b><span>murid sudah hantar<\/span><\/div>\n      <div class=\"stat\"><b>${pend.length}<\/b><span>sedang menjawab / belum hantar<\/span><\/div>\n      <div class=\"stat\"><b>${avg}%<\/b><span>purata<\/span><\/div>\n      <div class=\"stat\"><b>${pcts.length ? Math.max(...pcts) : 0}%<\/b><span>tertinggi<\/span><\/div>\n      <div class=\"stat\"><b>${pcts.length ? Math.min(...pcts) : 0}%<\/b><span>terendah<\/span><\/div>\n      <div class=\"stat\"><b>${done.length ? Math.round(pass / done.length * 100) : 0}%<\/b><span>lulus (≥50%)<\/span><\/div><\/div>\n    <div class=\"tabs\" id=\"rt\">${[['students', '👩‍🎓 Murid'], ['questions', '📈 Analisis Soalan'], ['matrix', '🧾 Butiran Jawapan']].map(([k, l]) => `<button class=\"btn ${rtab === k ? 'on' : ''}\" data-t=\"${k}\">${l}<\/button>`).join('')}<\/div>\n    <div id=\"rb\" style=\"margin-top:12px\"><\/div><\/div>`;\n  $('#bk').onclick = () => { view = 'tests'; render(); };\n  $('#rf').onclick = () => results(true);\n  $('#cf').onchange = e => { clsFilter = e.target.value; results(false); };\n  $('#xl').onclick = () => exportXlsx(t, A);\n  $$('#rt .btn').forEach(b => b.onclick = () => { rtab = b.dataset.t; results(false); });\n  ({ students: rStudents, questions: rQuestions, matrix: rMatrix })[rtab]($('#rb'), t, A, done);\n}\nconst ansOf = (a, i) => (a.details[i] || {});\nfunction rStudents(el, t, A) {\n  const S = A.slice().sort({\n    name: (a, b) => a.name.localeCompare(b.name), cls: (a, b) => a.cls.localeCompare(b.cls) || a.name.localeCompare(b.name),\n    score: (a, b) => (b.percent ?? -1) - (a.percent ?? -1), time: (a, b) => a.timeUsedSec - b.timeUsedSec,\n  }[sortBy]);\n  el.innerHTML = !A.length ? '<p class=\"muted\">Belum ada murid.<\/p>' : `<div class=\"scroll\"><table><tr><th>#<\/th><th data-s=\"name\">Nama ⇅<\/th><th data-s=\"cls\">Kelas ⇅<\/th><th data-s=\"score\">Markah ⇅<\/th><th data-s=\"score\">%<\/th><th data-s=\"time\">Masa ⇅<\/ 60).padStart(2, '0')}`; };\n\n  // ---- API (Google Apps Script web app) ----\n  // A script \"ref\" is either the deployment id (AKfy…) or a full URL (used for local testing)\n  const scriptUrl = ref => /^https?:/.test(ref) ? ref : `https://script.google.com/macros/s/${ref}/exec`;\n  const scriptRef = url => { const m = String(url).match(/\\/macros\\/s\\/([^/]+)\\/exec/); return m ? m[1] : String(url).trim(); };\n  async function call(ref, action, data = {}, tries = 3) {\n    let lastErr;\n    for (let i = 0; i < tries; i++) {\n      try {\n        const r = await fetch(scriptUrl(ref), { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data)) });\n        const j = await r.json();\n        if (!j.ok) { const e = new Error(j.error || 'Ralat'); e.server = true; throw e; }\n        return j;\n      } catch (e) {\n        lastErr = e; if (e.server) throw e;\n        await sleep(800 * (i + 1));\n      }\n    }\n    throw new Error('Tiada sambungan internet / pelayan tidak dapat dihubungi. (' + (lastErr && lastErr.message) + ')');\n  }\n\n  // ---- sound ----\n  let ac, muted = false;\n  function tone(fs, dur = .1, type = 'triangle', vol = .07) {\n    if (muted) return;\n    try {\n      ac = ac || new (window.AudioContext || window.webkitAudioContext)();\n      let t = ac.currentTime;\n      fs.forEach(f => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;\n        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur); t += dur * .8; });\n    } catch (e) {}\n  }\n  const sfx = {\n    pick: () => tone([700], .05, 'square', .04),\n    step: () => tone([440, 660], .07),\n    good: () => tone([660, 880], .07, 'triangle', .06),\n    bad: () => tone([220, 160], .12, 'sawtooth', .04),\n    boom: () => tone([140, 90, 50], .16, 'sawtooth', .09),\n    win: () => tone([523, 659, 784, 1046, 784, 1046], .13, 'triangle', .1),\n    lose: () => tone([392, 330, 262, 196], .2, 'triangle', .08),\n    tick: () => tone([1100], .03, 'sine', .04),\n    setMuted: m => { muted = m; },\n  };\n  function burst(x, y, emojis = ['🎉', '⭐', '✨'], n = 20) {\n    for (let i = 0; i < n; i++) {\n      const e = h(`<div class=\"burst\">${emojis[i % emojis.length]}<\/div>`);\n      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 160;\n      Object.assign(e.style, { left: x + 'px', top: y + 'px' });\n      e.style.setProperty('--dx', Math.cos(a) * d + 'px'); e.style.setProperty('--dy', Math.sin(a) * d + 'px');\n      document.body.appendChild(e); setTimeout(() => e.remove(), 1100);\n    }\n  }\n  const burstAt = (el, em, n) => { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, em, n); };\n  const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };\n  return { $, $$, esc, fmt, shuffle, sleep, h, store, mmss, call, scriptUrl, scriptRef, sfx, burst, burstAt, shake };\n})();\n", "themes.js": "/* 5 game themes. During the test every answer earns a sealed \"mystery\" item (right/wrong is hidden).\n   After submit, reveal(details) plays the big reveal animation and returns the finale headline.\n   Interface: THEMES[k] = { name, emoji, tagline, item, mount(sceneEl, total) -> { step(i), reveal(oks, pct, ctl) } } */\nconst THEMES = (() => {\n  const { h, sleep, sfx, burstAt, shake } = U;\n  const wait = (ctl, ms) => ctl.fast ? sleep(0) : sleep(ms);\n\n  // ---------- horizontal track used by space / treasure / race ----------\n  function Track(scene, total, o) {\n    const gap = o.gap || 74;\n    scene.innerHTML = `<div class=\"trk\">${o.deco || ''}<div class=\"strip\" style=\"width:${120 + total * gap}px\">\n      ${o.path ? `<div class=\"path\" style=\"left:40px;width:${(total - 1) * gap + 40}px\"><\/div>` : ''}\n      ${Array.from({ length: total }, (_, i) => `<div class=\"node\" data-i=\"${i}\" style=\"left:${40 + i * gap}px\">${o.node(i)}<span class=\"no\">${i + 1}<\/span><\/div>`).join('')}\n      <div class=\"avatar\">${o.avatar}<\/div><\/div>${o.hud || ''}<\/div>`;\n    const strip = scene.querySelector('.strip'), av = scene.querySelector('.avatar'), nodes = [...scene.querySelectorAll('.node')];\n    function focus(i, anim = true) {\n      const w = scene.clientWidth || 360, x = Math.min(0, w * .38 - (40 + i * gap));\n      strip.style.transition = anim ? 'transform .45s ease' : 'none';\n      strip.style.transform = `translateX(${x}px)`;\n    }\n    function moveTo(i) { av.style.left = (40 + Math.min(i, total - 1) * gap) + 'px'; av.classList.remove('hop'); void av.offsetWidth; av.classList.add('hop'); focus(i); }\n    moveTo(0);\n    return {\n      nodes, focus, moveTo, av,\n      step(i) { const n = nodes[i]; n.innerHTML = o.mystery + `<span class=\"no\">${i + 1}<\/span>`; n.classList.add('got'); sfx.step(); moveTo(i + 1); },\n      async revealAll(oks, ctl, each) {\n        moveTo(0); av.style.transition = 'left .18s linear';\n        for (let i = 0; i < oks.length; i++) {\n          moveTo(i); focus(i, !ctl.fast);\n          const n = nodes[i]; n.innerHTML = (oks[i] ? o.good(i) : o.bad(i)) + `<span class=\"no\">${i + 1}<\/span>`;\n          n.classList.add(oks[i] ? 'ok' : 'no', 'flip');\n          if (!ctl.fast) oks[i] ? sfx.good() : sfx.bad();\n          each && each(i, oks[i], n);\n          await wait(ctl, total > 30 ? 140 : 260);\n        }\n        av.style.transition = '';\n      },\n    };\n  }\n  function Grid(scene, total, o) {\n    scene.innerHTML = `<div class=\"gridscene\">${o.top || ''}<div class=\"cells\">${Array.from({ length: total }, (_, i) => `<div class=\"cell\" data-i=\"${i}\">${o.empty}<\/div>`).join('')}<\/div>${o.bottom || ''}<\/div>`;\n    const cells = [...scene.querySelectorAll('.cell')];\n    return { cells, step(i) { cells[i].innerHTML = o.mystery; cells[i].classList.add('got'); sfx.step(); } };\n  }\n  const overlay = (scene, html) => { const el = h(`<div class=\"finale\">${html}<\/div>`); scene.appendChild(el); return el; };\n\n  return {\n    // 1 ─────────────── SPACE\n    space: {\n      name: 'Misi Angkasa', emoji: '🚀', tagline: 'Terokai planet demi planet. Setiap jawapan memuatkan kargo misteri 📦 — buka semuanya selepas misi tamat!',\n      item: 'kargo 📦',\n      mount(scene, total) {\n        const P = ['🪐', '🌍', '🌕', '🌑', '🌎', '☀️', '🌏'];\n        const t = Track(scene, total, {\n          avatar: '<span class=\"rocket\">🚀<\/span>', node: i => `<span class=\"pl\">${P[i % P.length]}<\/span>`,\n          mystery: '<span class=\"pl\">📦<\/span>', good: () => '<span class=\"pl\">🛸<\/span><b class=\"tag g\">+1<\/b>', bad: () => '<span class=\"pl\">☄️<\/span>',\n          deco: '<div class=\"stars s1\"><\/div><div class=\"stars s2\"><\/div>', path: true,\n          hud: '<div class=\"hud\">⭐ <b class=\"cnt\">0<\/b><\/div>',\n        });\n        return {\n          step: t.step,\n          async reveal(oks, pct, ctl) {\n            let c = 0; const cnt = scene.querySelector('.cnt');\n            await t.revealAll(oks, ctl, (i, ok) => { if (ok) cnt.textContent = ++c; });\n            const r = pct >= 90 ? ['🏅', 'Laksamana Galaksi!'] : pct >= 75 ? ['🎖️', 'Komander Angkasa!'] : pct >= 50 ? ['🧑‍🚀', 'Kapten Roket!'] : ['🛰️', 'Kadet Angkasa'];\n            const f = overlay(scene, `<div class=\"big\">${r[0]}<\/div><div class=\"ttl\">${r[1]}<\/div><div class=\"sub\">${c} planet berjaya diteroka<\/div>`);\n            if (pct >= 50) { sfx.win(); burstAt(f, ['⭐', '🌟', '✨', '🚀'], 30); } else sfx.lose();\n            return { title: r[1], icon: r[0] };\n          },\n        };\n      },\n    },\n    // 2 ─────────────── DRAGON\n    dragon: {\n      name: 'Pertarungan Naga', emoji: '🐉', tagline: 'Setiap jawapan mengecas satu bola tenaga 🔮. Selepas hantar, semua tenaga dilepaskan ke arah naga. Cukup kuatkah serangan anda?',\n      item: 'bola tenaga 🔮',\n      mount(scene, total) {\n        const g = Grid(scene, total, {\n          top: `<div class=\"arena\"><div class=\"hero\">🧙‍♂️<\/div><div class=\"vs\">⚔️<\/div><div class=\"drg\"><div class=\"dragon\">🐉<\/div>\n            <div class=\"hpw\"><div class=\"hp\"><i><\/i><\/div><span class=\"hpn\"><\/span><\/div><\/div><\/div>`,\n          empty: '<span class=\"orb e\"><\/span>', mystery: '<span class=\"orb m\">?<\/span>',\n        });\n        const hpMax = Math.max(1, Math.ceil(total * .6));\n        const paint = hp => { scene.querySelector('.hp i').style.width = Math.max(0, hp / hpMax * 100) + '%'; scene.querySelector('.hpn').textContent = `❤ ${Math.max(0, hp)}/${hpMax}`; };\n        paint(hpMax);\n        return {\n          step: g.step,\n          async reveal(oks, pct, ctl) {\n            let hp = hpMax; const dragon = scene.querySelector('.dragon'), hero = scene.querySelector('.hero');\n            for (let i = 0; i < oks.length; i++) {\n              const c = g.cells[i];\n              c.innerHTML = oks[i] ? '<span class=\"orb y\">⚡<\/span>' : '<span class=\"orb n\">🔥<\/span>';\n              if (oks[i]) { hp--; paint(hp); if (!ctl.fast) { sfx.good(); shake(dragon); } }\n              else if (!ctl.fast) { sfx.bad(); shake(hero); }\n              await wait(ctl, total > 30 ? 120 : 220);\n            }\n            const win = hp <= 0;\n            if (win) { dragon.textContent = '💫'; sfx.win(); burstAt(dragon, ['💥', '⭐', '🏆'], 30); }\n            else { dragon.classList.add('flyaway'); sfx.lose(); }\n            const r = win ? (pct >= 90 ? ['🏆', 'Pembunuh Naga Legenda!'] : ['⚔️', 'Naga Ditewaskan!']) : ['🐉', 'Naga Melarikan Diri…'];\n            overlay(scene, `<div class=\"big\">${r[0]}<\/div><div class=\"ttl\">${r[1]}<\/div><div class=\"sub\">${oks.filter(Boolean).length} serangan kena sasaran (perlu ${hpMax})<\/div>`);\n            return { title: r[1], icon: r[0] };\n          },\n        };\n      },\n    },\n    // 3 ─────────────── TREASURE\n    treasure: {\n      name: 'Pulau Harta Karun', emoji: '🏴‍☠️', tagline: 'Belayar dari pulau ke pulau dan kutip peti harta 🧰. Peti hanya boleh dibuka selepas pelayaran tamat — emas atau tengkorak?',\n      item: 'peti harta 🧰',\n      mount(scene, total) {\n        const t = Track(scene, total, {\n          avatar: '<span class=\"ship\">⛵<\/span>', node: () => '<span class=\"isl\">🏝️<\/span>',\n          mystery: '<span class=\"isl\">🧰<\/span>', good: () => '<span class=\"isl\">💰<\/span><b class=\"tag g\">+100<\/b>', bad: () => '<span class=\"isl\">💀<\/span>',\n          deco: '<div class=\"waves\"><\/div>', path: true, hud: '<div class=\"hud\">🪙 <b class=\"cnt\">0<\/b><\/div>',\n        });\n        return {\n          step: t.step,\n          async reveal(oks, pct, ctl) {\n            let gold = 0; const cnt = scene.querySelector('.cnt');\n            await t.revealAll(oks, ctl, (i, ok, n) => { if (ok) { gold += 100; cnt.textContent = gold; if (!ctl.fast && i % 3 === 0) burstAt(n, ['🪙'], 5); } });\n            const r = pct >= 90 ? ['👑', 'Raja Lanun!'] : pct >= 75 ? ['🦜', 'Kapten Lanun!'] : pct >= 50 ? ['🗡️', 'Lanun Berani!'] : ['🪣', 'Kelasi Baharu'];\n            const f = overlay(scene, `<div class=\"big\">${r[0]}<\/div><div class=\"ttl\">${r[1]}<\/div><div class=\"sub\">🪙 ${gold} keping emas dikumpul<\/div>`);\n            if (pct >= 50) { sfx.win(); burstAt(f, ['🪙', '💰', '💎'], 30); } else sfx.lose();\n            return { title: r[1], icon: r[0] };\n          },\n        };\n      },\n    },\n    // 4 ─────────────── RACE\n    race: {\n      name: 'Lumba Nitro', emoji: '🏎️', tagline: 'Setiap jawapan mengisi satu tong nitro 🧪. Selepas hantar, nitro sebenar didedahkan dan perlumbaan akhir bermula!',\n      item: 'tong nitro 🧪',\n      mount(scene, total) {\n        const t = Track(scene, total, {\n          avatar: '<span class=\"car\">🏎️<\/span>', node: () => '<span class=\"cp\">🚩<\/span>',\n          mystery: '<span class=\"cp\">🧪<\/span>', good: () => '<span class=\"cp\">⚡<\/span>', bad: () => '<span class=\"cp\">🛢️<\/span>',\n          deco: '<div class=\"road\"><\/div>', gap: 70, hud: '<div class=\"hud\">⚡ <b class=\"cnt\">0<\/b><\/div>',\n        });\n        return {\n          step: t.step,\n          async reveal(oks, pct, ctl) {\n            let c = 0; const cnt = scene.querySelector('.cnt');\n            await t.revealAll(oks, ctl, (i, ok) => { if (ok) cnt.textContent = ++c; });\n            // final race: AI cars finish as if they scored 45%, 65%, 85%\n            const D = p => 5200 - 34 * p;\n            const cars = [{ e: '🏎️', p: pct, me: true }, { e: '🚙', p: 45 }, { e: '🚕', p: 65 }, { e: '🚓', p: 85 }];\n            const f = overlay(scene, `<div class=\"race\">${cars.map(x => `<div class=\"lane\"><span class=\"rc ${x.me ? 'me' : ''}\">${x.e}<\/span><span class=\"fin\">🏁<\/span><\/div>`).join('')}<\/div>`);\n            const els = [...f.querySelectorAll('.rc')];\n            const pos = 1 + cars.slice(1).filter(x => x.p > pct).length;\n            if (!ctl.fast) {\n              sfx.step();\n              els.forEach((el, i) => el.animate([{ left: '0%' }, { left: 'calc(100% - 40px)' }], { duration: D(cars[i].p), easing: 'ease-in', fill: 'forwards' }));\n              await sleep(Math.max(...cars.map(x => D(x.p))) + 200);\n            }\n            const r = pos === 1 ? ['🥇', 'Juara Lumba!'] : pos === 2 ? ['🥈', 'Tempat Kedua!'] : pos === 3 ? ['🥉', 'Tempat Ketiga!'] : ['🔧', 'Tempat Keempat'];\n            f.innerHTML = `<div class=\"big\">${r[0]}<\/div><div class=\"ttl\">${r[1]}<\/div><div class=\"sub\">${c} tong nitro penuh<\/div>`;\n            pos <= 2 ? (sfx.win(), burstAt(f, ['🏁', '⭐', '🎉'], 30)) : sfx.lose();\n            return { title: r[1], icon: r[0] };\n          },\n        };\n      },\n    },\n    // 5 ─────────────── ZOMBIE\n    zombie: {\n      name: 'Kubu Zombi', emoji: '🧟', tagline: 'Gerombolan zombi menghampiri! Setiap jawapan menambah satu bata misteri 🧱 pada tembok. Selepas hantar, kita lihat sama ada tembok anda cukup kuat…',\n      item: 'bata 🧱',\n      mount(scene, total) {\n        const g = Grid(scene, total, {\n          top: '<div class=\"horde\"><span>🧟<\/span><span>🧟‍♀️<\/span><span>🧟‍♂️<\/span><span>🧟<\/span><span>🧟‍♀️<\/span><\/div><div class=\"moon\">🌕<\/div>',\n          empty: '<span class=\"brick e\"><\/span>', mystery: '<span class=\"brick m\">?<\/span>',\n          bottom: '<div class=\"base\">🏚️ <span>Kubu anda<\/span> 🧑‍🤝‍🧑<\/div>',\n        });\n        return {\n          step: g.step,\n          async reveal(oks, pct, ctl) {\n            for (let i = 0; i < oks.length; i++) {\n              g.cells[i].innerHTML = oks[i] ? '<span class=\"brick y\"><\/span>' : '<span class=\"brick n\">💥<\/span>';\n              if (!ctl.fast) oks[i] ? sfx.good() : sfx.bad();\n              await wait(ctl, total > 30 ? 110 : 200);\n            }\n            const horde = scene.querySelector('.horde'), safe = pct >= 50;\n            horde.classList.add('attack'); await wait(ctl, 1400);\n            sfx.boom(); shake(scene.querySelector('.cells'));\n            if (safe) { horde.classList.add('repelled'); sfx.win(); burstAt(scene.querySelector('.cells'), ['💥', '🛡️', '⭐'], 26); }\n            else { horde.classList.add('breach'); sfx.lose(); }\n            await wait(ctl, 700);\n            const r = safe ? (pct >= 90 ? ['🛡️', 'Kubu Tidak Tertembus!'] : ['💪', 'Anda Bertahan!']) : ['🧟', 'Kubu Ditembusi!'];\n            overlay(scene, `<div class=\"big\">${r[0]}<\/div><div class=\"ttl\">${r[1]}<\/div><div class=\"sub\">${oks.filter(Boolean).length} bata kukuh daripada ${oks.length}<\/div>`);\n            return { title: r[1], icon: r[0] };\n          },\n        };\n      },\n    },\n  };\n})();\n", "importer.js": "/* xlsx/csv question importer: BlastRoom, Blooket, Kahoot layouts (same as Arked Kelas) */\nconst Importer = (() => {\n  const norm = s => String(s ?? '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');\n  const cell = v => (v === undefined || v === null) ? '' : String(v).trim();\n\n  /** rows: array of arrays (first sheet). Returns {questions, skipped, format} */\n  function parseRows(rows) {\n    let h = rows.findIndex(r => r && r.some(c => /^question/.test(norm(c))));\n    if (h < 0) throw new Error('Tidak jumpa lajur \"question\". Guna templat BlastRoom / Blooket / Kahoot.');\n    const cols = rows[h].map(norm);\n    const qCol = cols.findIndex(c => /^question/.test(c));\n    const ptsCol = cols.findIndex(c => /^points?$/.test(c));\n    const timeCol = cols.findIndex(c => /time/.test(c));\n    const out = []; let skipped = 0; let format;\n\n    const cCol = cols.indexOf('correct_answer');\n    const wCols = cols.map((c, i) => /^wrong_answer/.test(c) ? i : -1).filter(i => i >= 0);\n    const aCols = cols.map((c, i) => /^answer_?\\d/.test(c) ? i : -1).filter(i => i >= 0);\n    const ciCol = cols.findIndex(c => /^correct/.test(c) && c !== 'correct_answer');\n\n    for (const r of rows.slice(h + 1)) {\n      if (!r) continue;\n      const q = cell(r[qCol]);\n      if (!q) continue;\n      let correct = [], wrong = [];\n      if (cCol >= 0) {                       // BlastRoom: question | correct_answer | wrong_answer_1..3\n        format = 'BlastRoom';\n        const ci = ciCol >= 0 ? cell(r[ciCol]) : '';\n        if (/^[\\d,\\s]+$/.test(ci) && ci.trim()) {\n          // BlastRoom: \"correct_answers\" (1-based indices, e.g. \"1,3\") overrides headers;\n          // correct_answer + wrong_answer_1..3 are then treated as answers 1..4\n          const idx = ci.split(/[,\\s]+/).map(Number).filter(n => n >= 1);\n          [cCol, ...wCols].forEach((c, i) => { const a = cell(r[c]); if (a) (idx.includes(i + 1) ? correct : wrong).push(a); });\n        } else {\n          if (cell(r[cCol])) correct.push(cell(r[cCol]));\n          wCols.forEach(i => cell(r[i]) && wrong.push(cell(r[i])));\n        }\n      } else if (aCols.length) {             // Blooket / Kahoot: Answer 1..4 + Correct Answer(s) as numbers\n        format = 'Blooket/Kahoot';\n        const answers = aCols.map(i => cell(r[i]));\n        const idx = cell(r[ciCol]).split(/[,;\\s]+/).map(Number).filter(n => n >= 1);\n        answers.forEach((a, i) => { if (!a) return; (idx.includes(i + 1) ? correct : wrong).push(a); });\n      }\n      if (!correct.length) { skipped++; continue; }\n      const pts = Number(cell(r[ptsCol])) || 15;\n      const time = Number(cell(r[timeCol])) || 20;\n      out.push({ q, correct, wrong, points: pts, time });\n    }\n    return { questions: out, skipped, format: format || '?' };\n  }\n\n\n  async function read(file) {\n    if (!window.XLSX) throw new Error('Pustaka XLSX belum dimuatkan (perlukan internet).');\n    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });\n    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false, defval: '' });\n    const r = parseRows(rows);\n    if (!r.questions.length) throw new Error('Tiada soalan sah dijumpai dalam fail ini.');\n    return r;\n  }\n  return { parseRows, read };\n})();\n", "codegs.js": "window.__CODE_GS = \"/**\\n * Arked Ujian — backend untuk ujian output berasaskan permainan.\\n * Simpan semua ujian & keputusan dalam Google Sheet ini.\\n *\\n * CARA PASANG (sekali sahaja):\\n * 1. Buka Google Sheet baharu → Extensions → Apps Script.\\n * 2. Padam kod sedia ada, tampal SEMUA kod ini, tukar TEACHER_KEY di bawah, Save.\\n * 3. Deploy → New deployment → Type: Web app\\n *      Execute as: Me   |   Who has access: Anyone\\n *    → Deploy → Authorize → salin \\\"Web app URL\\\" (…/exec).\\n * 4. Tampal URL itu + TEACHER_KEY di halaman guru.\\n */\\n\\nconst TEACHER_KEY = 'tukar-kata-laluan-ini';   // ← TUKAR! Kata laluan guru\\n\\nconst SHEET_TESTS = 'Ujian';\\nconst SHEET_ATTEMPTS = 'Jawapan';\\nconst CHUNK = 40000;              // had selamat untuk satu sel (50k aksara)\\nconst GRACE_SEC = 90;             // kelonggaran masa sebelum ditanda \\\"lewat\\\"\\n\\nconst TEST_HEAD = ['testId', 'createdAt', 'title', 'theme', 'timeLimitMin', 'status', 'nQ', 'questions…'];\\nconst ATT_HEAD = ['testId', 'key', 'name', 'class', 'startedAt', 'submittedAt', 'score', 'total', 'percent', 'timeUsedSec', 'late', 'details'];\\n\\n// ---------------- entry points ----------------\\nfunction doGet(e) { return handle_(e && e.parameter || {}); }\\nfunction doPost(e) {\\n  let p = {};\\n  try { p = JSON.parse(e.postData.contents); } catch (err) { return out_({ ok: false, error: 'Bad JSON' }); }\\n  return handle_(p);\\n}\\nfunction handle_(p) {\\n  try {\\n    const fn = ROUTES[p.action];\\n    if (!fn) throw new Error('Tindakan tidak dikenali: ' + p.action);\\n    return out_(Object.assign({ ok: true, now: Date.now() }, fn(p)));\\n  } catch (err) {\\n    return out_({ ok: false, error: String(err && err.message || err) });\\n  }\\n}\\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\\n\\nconst ROUTES = {\\n  ping: p => { teacher_(p); return { sheet: SpreadsheetApp.getActive().getName() }; },\\n  createTest: p => createTest_(p),\\n  listTests: p => { teacher_(p); return { tests: listTests_() }; },\\n  setStatus: p => { teacher_(p); setStatus_(p.testId, p.status); return {}; },\\n  getTest: p => ({ test: publicTest_(getTest_(p.testId)) }),\\n  start: p => start_(p),\\n  submit: p => submit_(p),\\n  results: p => { teacher_(p); return results_(p.testId); },\\n  resetAttempt: p => { teacher_(p); resetAttempt_(p.testId, p.studentKey); return {}; },\\n};\\n\\n// ---------------- helpers ----------------\\nfunction teacher_(p) { if (String(p.key || '') !== TEACHER_KEY) throw new Error('Kata laluan guru salah'); }\\nfunction sheet_(name, head) {\\n  const ss = SpreadsheetApp.getActive();\\n  let sh = ss.getSheetByName(name);\\n  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(head); sh.setFrozenRows(1); }\\n  return sh;\\n}\\nfunction norm_(s) { return String(s || '').trim().replace(/\\\\s+/g, ' ').toLowerCase(); }\\nfunction normAns_(s) { return norm_(s).replace(/[.!?。]+$/, ''); }\\nfunction studentKey_(name, cls) { return norm_(name) + '|' + norm_(cls); }\\nfunction newId_() {\\n  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';\\n  let id = ''; for (let i = 0; i < 6; i++) id += A[Math.floor(Math.random() * A.length)];\\n  return id;\\n}\\nfunction shuffle_(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\\nfunction lock_(fn) { const l = LockService.getScriptLock(); l.waitLock(20000); try { return fn(); } finally { l.releaseLock(); } }\\n\\n// ---------------- tests ----------------\\nfunction createTest_(p) {\\n  teacher_(p);\\n  const qs = (p.questions || []).map(q => ({\\n    q: String(q.q || '').slice(0, 1000),\\n    correct: (q.correct || []).map(String).filter(Boolean),\\n    wrong: (q.wrong || []).map(String).filter(Boolean),\\n  })).filter(q => q.q && q.correct.length);\\n  if (!qs.length) throw new Error('Tiada soalan');\\n  const json = JSON.stringify(qs);\\n  const chunks = []; for (let i = 0; i < json.length; i += CHUNK) chunks.push(json.slice(i, i + CHUNK));\\n  return lock_(() => {\\n    const sh = sheet_(SHEET_TESTS, TEST_HEAD);\\n    const ids = sh.getDataRange().getValues().map(r => r[0]);\\n    let id; do { id = newId_(); } while (ids.indexOf(id) >= 0);\\n    sh.appendRow([id, new Date(), String(p.title || 'Ujian').slice(0, 120), String(p.theme || 'space'),\\n      Math.max(0, Number(p.timeLimitMin) || 0), 'open', qs.length].concat(chunks));\\n    return { testId: id };\\n  });\\n}\\nfunction findTestRow_(testId) {\\n  const sh = sheet_(SHEET_TESTS, TEST_HEAD);\\n  const v = sh.getDataRange().getValues();\\n  for (let i = 1; i < v.length; i++) if (v[i][0] === testId) return { sh: sh, row: i + 1, v: v[i] };\\n  return null;\\n}\\nfunction getTest_(testId) {\\n  const f = findTestRow_(String(testId || '').toUpperCase());\\n  if (!f) throw new Error('Ujian tidak dijumpai');\\n  const r = f.v;\\n  return { testId: r[0], createdAt: r[1], title: r[2], theme: r[3], timeLimitMin: Number(r[4]) || 0, status: r[5],\\n    questions: JSON.parse(r.slice(7).filter(String).join('')) };\\n}\\nfunction publicTest_(t) {\\n  // never send which answer is correct\\n  return { testId: t.testId, title: t.title, theme: t.theme, timeLimitMin: t.timeLimitMin, status: t.status,\\n    questions: t.questions.map((q, i) => q.wrong.length\\n      ? { id: i, q: q.q, type: 'mcq', options: shuffle_([q.correct[0]].concat(q.wrong)) }\\n      : { id: i, q: q.q, type: 'blank' }) };\\n}\\nfunction listTests_() {\\n  const v = sheet_(SHEET_TESTS, TEST_HEAD).getDataRange().getValues().slice(1);\\n  const a = sheet_(SHEET_ATTEMPTS, ATT_HEAD).getDataRange().getValues().slice(1);\\n  return v.map(r => ({ testId: r[0], createdAt: r[1], title: r[2], theme: r[3], timeLimitMin: r[4], status: r[5], nQ: r[6],\\n    submitted: a.filter(x => x[0] === r[0] && x[5]).length })).reverse();\\n}\\nfunction setStatus_(testId, status) {\\n  const f = findTestRow_(testId); if (!f) throw new Error('Ujian tidak dijumpai');\\n  f.sh.getRange(f.row, 6).setValue(status === 'closed' ? 'closed' : 'open');\\n}\\n\\n// ---------------- attempts ----------------\\nfunction findAttempt_(sh, testId, key) {\\n  const v = sh.getDataRange().getValues();\\n  for (let i = 1; i < v.length; i++) if (v[i][0] === testId && v[i][1] === key) return { row: i + 1, v: v[i] };\\n  return null;\\n}\\nfunction start_(p) {\\n  const t = getTest_(p.testId);\\n  const name = String(p.name || '').trim().replace(/\\\\s+/g, ' ').slice(0, 60);\\n  const cls = String(p.cls || '').trim().replace(/\\\\s+/g, ' ').slice(0, 30);\\n  if (name.length < 2) throw new Error('Sila tulis nama penuh');\\n  if (!cls) throw new Error('Sila tulis kelas');\\n  const key = studentKey_(name, cls);\\n  return lock_(() => {\\n    const sh = sheet_(SHEET_ATTEMPTS, ATT_HEAD);\\n    const f = findAttempt_(sh, t.testId, key);\\n    if (f && f.v[5]) throw new Error('SUDAH_HANTAR');\\n    if (t.status !== 'open') throw new Error('Ujian ini sudah ditutup oleh guru');\\n    let startedAt;\\n    if (f) startedAt = Number(f.v[4]);\\n    else { startedAt = Date.now(); sh.appendRow([t.testId, key, name, cls, startedAt, '', '', '', '', '', '', '']); }\\n    return { startedAt: startedAt, timeLimitMin: t.timeLimitMin, resumed: !!f };\\n  });\\n}\\nfunction grade_(t, answers) {\\n  answers = answers || {};\\n  let score = 0;\\n  const details = t.questions.map((q, i) => {\\n    const a = answers[i] === undefined || answers[i] === null ? '' : String(answers[i]);\\n    const ok = !!a && (q.wrong.length ? q.correct.indexOf(a) >= 0 : q.correct.some(c => normAns_(c) === normAns_(a)));\\n    if (ok) score++;\\n    return { id: i, a: a, ok: ok };\\n  });\\n  return { score: score, total: t.questions.length, details: details };\\n}\\nfunction submit_(p) {\\n  const t = getTest_(p.testId);\\n  const key = studentKey_(p.name, p.cls);\\n  return lock_(() => {\\n    const sh = sheet_(SHEET_ATTEMPTS, ATT_HEAD);\\n    const f = findAttempt_(sh, t.testId, key);\\n    if (!f) throw new Error('Sila mula ujian dahulu');\\n    if (f.v[5]) throw new Error('SUDAH_HANTAR');\\n    const g = grade_(t, p.answers);\\n    const now = Date.now(), used = Math.round((now - Number(f.v[4])) / 1000);\\n    const late = t.timeLimitMin > 0 && used > t.timeLimitMin * 60 + GRACE_SEC;\\n    const pct = Math.round(g.score / g.total * 1000) / 10;\\n    sh.getRange(f.row, 6, 1, 7).setValues([[now, g.score, g.total, pct, used, late ? 'YA' : '', JSON.stringify(g.details)]]);\\n    writeReadable_(t, f.v[2], f.v[3], g, pct, used, late);\\n    return { score: g.score, total: g.total, percent: pct, timeUsedSec: used, late: late,\\n      review: t.questions.map((q, i) => ({ id: i, q: q.q, correct: q.correct, a: g.details[i].a, ok: g.details[i].ok })) };\\n  });\\n}\\n// A friendly per-test sheet the teacher can open directly in Google Sheets\\nfunction writeReadable_(t, name, cls, g, pct, used, late) {\\n  const title = ('Keputusan ' + t.testId + ' ' + t.title).replace(/[\\\\[\\\\]\\\\*\\\\?\\\\/\\\\\\\\:]/g, ' ').slice(0, 90);\\n  const head = ['Masa hantar', 'Nama', 'Kelas', 'Markah', 'Jumlah', '%', 'Masa (min)', 'Lewat']\\n    .concat(t.questions.map((q, i) => 'S' + (i + 1)));\\n  const sh = sheet_(title, head);\\n  sh.appendRow([new Date(), name, cls, g.score, g.total, pct, Math.round(used / 6) / 10, late ? 'YA' : '']\\n    .concat(g.details.map(d => (d.ok ? '✓ ' : '✗ ') + d.a)));\\n}\\nfunction results_(testId) {\\n  const t = getTest_(testId);\\n  const v = sheet_(SHEET_ATTEMPTS, ATT_HEAD).getDataRange().getValues().slice(1).filter(r => r[0] === t.testId);\\n  return {\\n    test: { testId: t.testId, title: t.title, theme: t.theme, timeLimitMin: t.timeLimitMin, status: t.status, questions: t.questions },\\n    attempts: v.map(r => ({ key: r[1], name: r[2], cls: r[3], startedAt: Number(r[4]), submittedAt: Number(r[5]) || 0,\\n      score: r[6] === '' ? null : Number(r[6]), total: Number(r[7]) || t.questions.length, percent: r[8] === '' ? null : Number(r[8]),\\n      timeUsedSec: Number(r[9]) || 0, late: r[10] === 'YA', details: r[11] ? JSON.parse(r[11]) : [] })),\\n  };\\n}\\nfunction resetAttempt_(testId, key) {\\n  lock_(() => {\\n    const sh = sheet_(SHEET_ATTEMPTS, ATT_HEAD);\\n    const f = findAttempt_(sh, testId, key);\\n    if (f) sh.deleteRow(f.row);\\n  });\\n}\\n\";"};
var f = document.getElementById('f');
var SELF = location.href.split('#')[0];
function show(name, q) {
  if (!PAGES[name]) name = 'index';
  var inject = '<script>window.__SELF=' + JSON.stringify(SELF) + ';window.__Q=' + JSON.stringify(q || '') + ';<\/script>';
  f.srcdoc = PAGES[name].replace('__INJECT__', inject).replace(/@@([a-z]+\.(?:css|js))@@/g, function (m, k) { return SHARED[k]; });
  f.onload = function () { try { document.title = f.contentDocument.title; } catch (e) {} f.focus(); };
}
function route() {
  var h = location.hash.slice(1), i = h.indexOf('?');
  show(i < 0 ? h : h.slice(0, i), i < 0 ? '' : h.slice(i));
}
window.addEventListener('message', function (e) {
  if (!e.data || !e.data.arkedGo) return;
