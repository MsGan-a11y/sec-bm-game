<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pahlawan Ais vs Raja Matahari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2b1b4a; --bg2:#4a2468; --gold:#ffd23f; --hot:#ff5a5f; --ice:#5ad1ff; --ok:#3ddc84; --bad:#ff5a5f;
  --card:#fffaf3; --ink:#2d1f3d; --soft:#7a6a8a; --line:#ecdcf7;
  --font:'Waknan','Baloo 2','ZCOOL KuaiLe',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.45;
  background:radial-gradient(circle at 50% -10%,#ff9f43 0%,#c0392b 22%,var(--bg2) 50%,var(--bg1) 100%) fixed;}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 30px;position:relative}
.zh{font-family:'ZCOOL KuaiLe','Waknan','Baloo 2',sans-serif;color:var(--soft);font-size:.86em}
.light .zh,.dark .zh{color:#e5d6ff}
button{font-family:inherit;cursor:pointer;border:none}
h1,h2,h3{margin:.2em 0;line-height:1.15}
.sym{font-family:'Baloo 2',system-ui,sans-serif;font-style:normal}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 6px 0 #c9b3e0,0 10px 26px rgba(0,0,0,.3);margin-bottom:12px}
.dark{color:#fff;text-align:center}
.btn{display:inline-block;padding:13px 22px;border-radius:16px;font-weight:800;font-size:1.05em;color:#3a2600;
  background:linear-gradient(180deg,#ffe066,#ffb703);box-shadow:0 5px 0 #c77d00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c77d00}
.btn.block{display:block;width:100%;margin-top:10px}
.btn.blue{background:linear-gradient(180deg,#7fe3ff,#29b6f6);box-shadow:0 5px 0 #0b7fb3;color:#06324a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn:disabled{opacity:.45;pointer-events:none}
input.name{width:100%;font-family:inherit;font-size:1.1em;padding:12px 14px;border-radius:14px;border:3px solid var(--line);margin-top:8px;text-align:center;user-select:text}
.title{font-size:2.1em;font-weight:800;color:#fff;text-shadow:0 4px 0 #8e2de2,0 0 18px rgba(255,210,63,.7);text-align:center;line-height:1.05}
.vs{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0}
.vs .v{font-size:2em;font-weight:800;color:var(--gold);text-shadow:0 3px 0 #b33}
.bigemo{font-size:72px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.hero{width:96px}
.float{animation:float 2.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.mute{position:fixed;bottom:12px;right:12px;z-index:40;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}

/* map */
.map{display:grid;gap:10px;margin-top:6px}
.node{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:18px;padding:10px 12px;color:#fff;text-align:left}
.node .e{font-size:38px;width:50px;text-align:center}
.node.cur{background:rgba(255,210,63,.18);border-color:var(--gold);animation:glow 1.4s infinite}
.node.done{opacity:.85}
.node.lock{opacity:.4}
.node .st{margin-left:auto;font-size:1.1em;white-space:nowrap}
@keyframes glow{50%{box-shadow:0 0 18px rgba(255,210,63,.7)}}

/* battle */
.arena{position:relative;border-radius:22px;padding:10px 12px 8px;margin-bottom:10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,159,67,.35),rgba(0,0,0,.25)),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 20px,transparent 20px 40px);
  border:2px solid rgba(255,255,255,.18)}
.mrow{display:flex;align-items:center;gap:10px}
.mname{color:#fff;font-weight:800;font-size:.95em}
.hpbar{height:14px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;border:2px solid rgba(255,255,255,.3)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5a5f,#ff9f43);transition:width .5s}
.monster{font-size:84px;text-align:center;line-height:1.05;margin:4px 0 2px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45));transition:transform .2s}
.monster.hit{animation:hit .45s}
.monster.atk{animation:atk .5s}
.monster.dead{animation:die .8s forwards}
@keyframes hit{0%,100%{transform:none;filter:none}30%{transform:translateX(10px) rotate(8deg);filter:brightness(3) drop-shadow(0 0 10px #fff)}60%{transform:translateX(-8px)}}
@keyframes atk{40%{transform:scale(1.35) translateY(20px)}}
@keyframes die{to{transform:scale(0) rotate(360deg);opacity:0}}
.herorow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hearts{font-size:1.25em;letter-spacing:1px}
.combo{color:var(--gold);font-weight:800;text-shadow:0 2px 0 #8e2de2}
.items{display:flex;gap:6px;margin-top:8px}
.item{flex:1;background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:5px 4px;font-size:.78em;font-weight:800;line-height:1.1}
.item b{display:block;font-size:1.4em}
.item:disabled{opacity:.35}
.dmg{position:absolute;font-weight:800;font-size:30px;pointer-events:none;animation:dmg 1s forwards;z-index:9;text-shadow:0 3px 0 rgba(0,0,0,.4)}
@keyframes dmg{to{transform:translateY(-60px);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(8px,-3px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,0)}}
.redflash{position:fixed;inset:0;background:rgba(255,0,0,.35);pointer-events:none;z-index:30;animation:fade .4s forwards}
@keyframes fade{to{opacity:0}}
.timer{height:8px;border-radius:999px;background:#eadff5;overflow:hidden;margin:6px 0}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a5f,#ffd23f);transition:width .25s linear}
.timer.frozen i{background:linear-gradient(90deg,#7fe3ff,#c9f3ff)}

/* question */
.qtype{font-size:.72em;font-weight:800;color:#8e2de2;letter-spacing:.5px}
.qtext{font-size:1.08em;font-weight:800;margin:3px 0}
.passage{background:#fff;border-left:6px solid #ffb703;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:.95em}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;font-size:1em;color:var(--ink);font-weight:700;display:flex;gap:10px;align-items:center;transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:#f1e6ff;color:#8e2de2;display:flex;align-items:center;justify-content:center;font-weight:800}
.opt.ok{border-color:var(--ok);background:#e6fbef}
.opt.bad{border-color:var(--bad);background:#ffecec}
.opt.gone{opacity:.25;pointer-events:none}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.sp{background:#f1e6ff;border-radius:9px;padding:2px 8px;white-space:nowrap}
.arr{color:#8e2de2;font-weight:800}
.slots{display:grid;gap:6px;margin:8px 0;min-height:54px;background:#fff;border:3px dashed var(--line);border-radius:14px;padding:6px}
.slot{display:flex;gap:8px;align-items:flex-start;background:#f1e6ff;border-radius:10px;padding:7px 9px;font-weight:700;text-align:left;color:var(--ink);font-size:.93em}
.slot .n{flex:none;width:24px;height:24px;border-radius:50%;background:#8e2de2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8em}
.slot.ok{background:#e6fbef}.slot.bad{background:#ffecec}
.pool{display:grid;gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;font-size:.93em;color:var(--ink);font-weight:600}
.chip.used{opacity:.25;pointer-events:none}
.empty{color:#b9a9c9;text-align:center;font-size:.9em;padding:8px}
.titem{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px;margin-top:8px}
.titem .s{font-weight:700;margin-bottom:5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:5px 9px;border-radius:999px;background:#f3ecfa;color:var(--ink);font-size:.8em;font-weight:800}
.tag.sel{background:#8e2de2;color:#fff}
.titem.ok{border-color:var(--ok);background:#f0fcf5}.titem.bad{border-color:var(--bad);background:#fff3f3}
.fix{font-size:.85em;font-weight:800;color:var(--bad);margin-top:4px}
.hintbox{background:#fffbe6;border:2px dashed #ffb703;border-radius:12px;padding:7px 10px;margin-top:8px}
.fb{border-radius:16px;padding:10px 12px;margin-top:10px;animation:pop .3s}
.fb.ok{background:#e6fbef;border:3px solid var(--ok)}
.fb.bad{background:#ffecec;border:3px solid var(--bad)}
.fb h3{margin:0 0 3px}
.note{background:#fff;border-radius:10px;padding:7px 10px;margin-top:6px;font-weight:700}
.note::before{content:"📌 "}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}

/* scroll / results */
.scroll{background:linear-gradient(180deg,#fff6dc,#ffe9b3);border-radius:18px;padding:14px;border:3px solid #e0b34d;box-shadow:0 6px 0 #b8862b}
.fstep{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.7);border-radius:12px;padding:7px 10px;margin-top:7px}
.fnum{flex:none;width:30px;height:30px;border-radius:50%;background:#8e2de2;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.fstep b{display:block}
.stars{font-size:2.6em;letter-spacing:4px;text-align:center}
.stars span{display:inline-block;animation:starpop .5s backwards}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
.stat{display:flex;justify-content:space-around;text-align:center;margin:8px 0}
.stat b{display:block;font-size:1.5em;color:#8e2de2}
.cert{background:linear-gradient(135deg,#fff8e1,#fff);border:5px double #e0b34d;border-radius:18px;padding:16px;text-align:center}
.cert .nm{font-size:1.8em;font-weight:800;color:#8e2de2;border-bottom:2px dashed #e0b34d;display:inline-block;padding:0 10px;margin:4px 0}
.rank{display:inline-block;background:#8e2de2;color:#fff;border-radius:999px;padding:3px 14px;font-weight:800}
.model p{background:#fff;border-radius:12px;padding:9px 11px;margin:7px 0;line-height:1.8}
.r{border-radius:5px;padding:0 2px}
.r0{background:#ffe0c2}.r1{background:#d8f3ef}.r2{background:#fff0a8}.r3{background:#e8defc}.r4{background:#ffd6dc}
.wc{font-size:.8em;font-weight:800;color:#2a9d8f}
.small{font-size:.82em}
.particle{position:fixed;pointer-events:none;z-index:50;font-size:24px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:60;font-size:2.4em;font-weight:800;color:#fff;white-space:nowrap;
  text-shadow:0 4px 0 #8e2de2,0 0 24px rgba(255,210,63,.9);pointer-events:none;animation:ban 1.2s forwards}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}


/* ========== PAHLAWAN AIS 3D REMASTER ========== */
:root{--bg1:#071c43;--bg2:#1b4b96;--gold:#ffdb66;--ice:#75eaff;--ink:#173152;--soft:#536e8b;--line:#a5c7ed;--card:#fff7e9;--font:'Baloo 2','ZCOOL KuaiLe',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{overflow-x:hidden;background:#102e68;color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 90% 10%,#ffe58d 0,transparent 16%),radial-gradient(ellipse at 85% 30%,rgba(255,125,70,.65),transparent 45%),radial-gradient(ellipse at 10% 22%,rgba(61,209,255,.7),transparent 42%),linear-gradient(135deg,#0a2c69 0%,#386bb9 33%,#766cba 59%,#dc6b7d 80%,#713d7a 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.48;background-image:radial-gradient(2px 2px at 10% 11%,white 80%,transparent),radial-gradient(2px 2px at 80% 18%,white 80%,transparent),radial-gradient(3px 3px at 50% 39%,white 80%,transparent),radial-gradient(3px 3px at 18% 72%,white 80%,transparent),radial-gradient(2px 2px at 75% 80%,white 80%,transparent);background-size:180px 260px}
.world{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.world .orb{position:absolute;width:clamp(160px,28vw,310px);aspect-ratio:1;right:-70px;top:2%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff9c7 0%,#ffda65 30%,#ff8246 58%,#f45444 76%,transparent 77%);filter:drop-shadow(0 0 35px rgba(255,167,68,.9));opacity:.82}
.world .icepeak{position:absolute;bottom:-20px;left:-10%;width:70%;height:33%;background:linear-gradient(126deg,#cfffff,#53bbff 36%,#2864bd 60%,#142d75);clip-path:polygon(0 100%,5% 58%,13% 74%,28% 9%,39% 58%,52% 31%,72% 100%);filter:drop-shadow(0 -10px 15px #8ee7ff)}
.world .lava{position:absolute;bottom:-10px;right:-15%;width:75%;height:33%;background:linear-gradient(124deg,#522c67,#b64b65 57%,#ff9a4e);clip-path:polygon(0 100%,20% 48%,38% 80%,54% 13%,71% 70%,84% 35%,100% 100%);opacity:.75}
.wrap{max-width:540px;padding:16px 15px 65px}
.dark .zh{color:#d8f1ff!important;text-shadow:0 1px 4px #123764}.zh{font-family:'ZCOOL KuaiLe','Microsoft YaHei',sans-serif;color:#59708b;font-size:.9em}
.dark h2{font-size:2em;text-shadow:0 3px 0 #0d447d,0 8px 16px #152953}
.title{font-size:clamp(2.2em,8.7vw,3.2em);letter-spacing:1px;line-height:1.12;color:#d6faff;-webkit-text-stroke:1.5px #1c7cd3;text-shadow:0 2px 0 #fff,0 5px 0 #1792d3,0 8px 0 #14518b,0 15px 22px rgba(0,20,70,.8)}
.vs{position:relative;min-height:160px;gap:14px;margin:16px 0 10px;perspective:750px}.vs .hero{width:150px;height:175px;filter:drop-shadow(0 16px 10px #11294a) drop-shadow(0 0 16px #94ebff)}
.vs .bigemo{font-size:105px;filter:drop-shadow(0 15px 10px #3e1b30) drop-shadow(0 0 20px #ffd361);transform-style:preserve-3d}
.vs .v{font-size:3em;color:#ffe774;-webkit-text-stroke:2px #a7520f;text-shadow:0 5px 0 #b84410,0 9px 15px #421b31;transform:rotate(-8deg)}
.card{background:linear-gradient(155deg,#fffdf7 0%,#fcf0da 100%);border:3px solid #b0d6f6;border-radius:25px;padding:17px;box-shadow:inset 0 3px 0 #fff,0 7px 0 #5a8db9,0 16px 0 rgba(16,43,89,.23),0 24px 32px rgba(5,21,61,.38)}
.card p{line-height:1.6}
.btn{min-height:56px;border:2px solid #fff1ba;border-radius:19px;letter-spacing:.2px;color:#643300;background:linear-gradient(#fff5b5 0%,#ffcf55 42%,#f6a728 100%);box-shadow:inset 0 3px 0 #fffce3,0 7px 0 #a85816,0 12px 21px #102b5380;text-shadow:0 1px 0 #fff3cc;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.09);transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:inset 0 1px 0 #fff,0 2px 0 #a85816}
.btn.blue{color:#043c79;background:linear-gradient(#d6ffff,#74eaff 47%,#3094e9);border-color:#e5ffff;box-shadow:inset 0 3px 0 #fff,0 6px 0 #0a569b,0 12px 22px #13265370}
.btn.ghost{box-shadow:0 5px 0 #a6bedd}
.fstep{border:1.5px solid #cee2fa;background:linear-gradient(165deg,#ffffff,#e9f3ff);box-shadow:0 3px 0 #c5d8ec;border-radius:15px;padding:10px 12px;align-items:center}.fstep .zh{display:block;margin-top:3px;line-height:1.45}
.fnum{width:41px;height:41px;border:2px solid #e3fbff;background:linear-gradient(145deg,#8beeff,#2176ca);box-shadow:0 4px 0 #2154a4,0 6px 12px #3b76aa55;font-size:1.13em}
input.name{min-height:54px;border:3px solid #92c4ef;background:linear-gradient(#fff,#edf8ff);box-shadow:inset 0 3px 6px #b1c8de;font-size:1em}
.map{gap:14px;position:relative;padding:18px 0 12px}.map::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:41px;width:11px;border-radius:10px;background:repeating-linear-gradient(180deg,#d8f7ff 0 25px,#72c6ec 25px 38px);box-shadow:0 0 10px #7feeff}
.node{position:relative;min-height:90px;padding:12px 13px;gap:9px;border:2px solid #b7dfff;border-radius:23px;background:linear-gradient(135deg,rgba(26,82,146,.96),rgba(22,50,105,.96));box-shadow:inset 0 3px 0 #91d6ff66,0 7px 0 #0b2851,0 12px 22px #0006;transform:perspective(750px) rotateX(1deg)}
.node .e{font-size:47px;flex:0 0 59px;width:59px;height:60px;display:grid;place-items:center;border-radius:19px;background:radial-gradient(circle at 30% 24%,#ffffff88,#86d8fc33 50%,#0d4d92);border:2px solid #8cd3f8;filter:drop-shadow(0 5px 2px #0006)}
.node span:not(.e){min-width:0}.node b{font-size:1.02em;line-height:1.2;display:block}.node .zh{font-size:.79em}.node .st{font-size:1.2em;flex-shrink:0}
.node.cur{border-color:#b9feff;background:linear-gradient(130deg,#2182d3,#144179);box-shadow:inset 0 3px 0 #bffaff,0 7px 0 #134478,0 0 26px #6cfaff7a}
.node.done{opacity:1;border-color:#9ef4c9}.node.lock{opacity:.76;filter:saturate(.6)}
.scroll{background:linear-gradient(160deg,#fff7d9,#eacb81);border:5px solid #ad7139;border-radius:23px;box-shadow:inset 0 3px 0 #fff9d6,0 9px 0 #7f4e2c,0 22px 34px #10224d66;padding:17px}
.scroll h3{color:#784318;font-size:1.28em}.scroll .zh{color:#805a3b}
.bigemo{font-size:98px;filter:drop-shadow(0 12px 4px #11294d) drop-shadow(0 0 14px #9fdbff)}
.arena{isolation:isolate;min-height:254px;padding:14px;margin-bottom:20px;border:3px solid #97e7ff;border-radius:28px;background:radial-gradient(ellipse at 50% 100%,#90dfff99,transparent 46%),radial-gradient(circle at 50% -20%,#4379d6,#15345e 70%);box-shadow:inset 0 3px 1px #e2ffff,0 7px 0 #17548c,0 17px 27px #091d48bb}

.arena::after{content:"";pointer-events:none;position:absolute;left:18%;right:18%;top:35%;height:45%;border-radius:50%;background:radial-gradient(ellipse,#92dffd55,transparent 70%);z-index:-1}
.mname{font-size:1.08em;color:#d7f8ff;text-shadow:0 2px #0b315d}.hpbar{height:18px;border:2px solid #e4f8ff;background:#112340;box-shadow:inset 0 2px 5px #000a,0 3px 0 #7ebfff}.hpbar i{background:linear-gradient(180deg,#ffae96 0%,#fa4c65 55%,#b62147);box-shadow:inset 0 2px 0 #ffddd0}
.monster{height:115px;display:flex;justify-content:center;align-items:center;font-size:91px;text-shadow:0 6px 3px #123365;filter:drop-shadow(0 13px 3px #0006) drop-shadow(0 0 13px #fff4);animation:monsterFloat 2.6s ease-in-out infinite}
@keyframes monsterFloat{50%{transform:translateY(-9px) rotate(3deg)}}
.monster.hit{animation:hit .45s}.monster.atk{animation:atk .5s}.monster.dead{animation:die .8s forwards}
.hearts{font-size:1.23em}.combo{text-shadow:0 2px 0 #7c391c}
.item{padding:10px 5px;border:2px solid #b4ecff;border-radius:15px;background:linear-gradient(#479cdc,#1763ad 45%,#10447d);box-shadow:inset 0 2px 0 #d6f7ff88,0 4px 0 #072747,0 7px 10px #0005;font-size:.77em;min-height:68px}.item b{font-size:1.95em;filter:drop-shadow(0 4px 2px #082f69)}.item:active{transform:translateY(3px)}
.qtype{display:table;margin:-3px auto 13px;text-align:center;color:#fff;background:linear-gradient(#4598ea,#1856a8);border:2px solid #a6e4ff;box-shadow:0 4px 0 #143769;border-radius:14px;padding:6px 13px;font-size:.85em}
.qtext{text-align:center;font-size:1.17em;line-height:1.5}.card#qc>.zh{text-align:center}.timer{height:13px;background:#223e60;border:2px solid #a8cced;box-shadow:inset 0 2px 4px #092943;margin:14px 0}.timer i{background:linear-gradient(#b6f98c,#2fc85e 55%,#139849)}
.opt,.chip,.slot,.titem{border:2px solid #b4cce6;border-radius:15px;background:linear-gradient(#fff,#e8f1ff);box-shadow:inset 0 2px 0 #fff,0 4px 0 #b7cce1;color:#143c69}
.opt{min-height:56px;padding:11px}.opt .k{border-radius:50%;background:linear-gradient(#72c8ff,#1b6cb9);color:white;border:2px solid #a8e9ff;box-shadow:0 3px 0 #154b90;width:33px;height:33px}.opt.ok{background:linear-gradient(#efffec,#c3fbd4);border-color:#35c47c}.opt.bad{background:linear-gradient(#fff0ef,#ffd6d5);border-color:#ff6b6b}
.opt:hover:not(:disabled),.chip:hover:not(.used),.tag:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-1px)}
.tag{border:2px solid #d1e3f9;background:linear-gradient(#fff,#e1edff);box-shadow:0 2px #b9cee5}.tag.sel{background:linear-gradient(#68c5ff,#2871c8);border-color:#73b9f4;color:white}
.slots{border:2px dashed #85bff4}.slot .n{background:linear-gradient(#7bcffd,#246abe)}.sp{background:#d9edff}.arr{color:#1977c1}
.fb{box-shadow:0 3px 9px #14396022}.hintbox{background:linear-gradient(#fffbe0,#fff2b9)}
.cert{border:6px double #d0a54e;box-shadow:inset 0 0 0 4px #fff9ea}.cert .nm,.stat b{color:#175da9}.rank{background:linear-gradient(#359cf2,#114f9c)}
.mute{border:2px solid #a6eaff;background:linear-gradient(#54a7e8,#0c5294);box-shadow:0 4px 0 #092c55,0 9px 18px #0008;width:49px;height:49px;right:15px;bottom:15px}
@media(min-width:780px){.wrap{max-width:610px}.vs .hero{width:166px}.node{min-height:95px}}
@media(max-width:380px){.wrap{padding:10px 9px 65px}.node{gap:6px;padding:8px}.node .e{width:46px;flex-basis:46px;font-size:36px}.vs .hero{width:110px}.vs .bigemo{font-size:78px}.vs .v{font-size:2.4em}.title{font-size:2em}}
@media(prefers-reduced-motion:reduce){.float,.monster,.node.cur{animation:none}*{scroll-behavior:auto!important}}

.mrow{border-radius:12px;background:#011a46c9;padding:7px 10px;flex-wrap:wrap}
.hpbar{height:21px;background:#09132a;border:3px solid #a9dbff;box-shadow:0 4px 8px #00162c}
.hpbar i{background:linear-gradient(180deg,#ffb699,#ff3359 55%,#b91f46)}
.monster{height:180px;display:flex;align-items:center;justify-content:center;margin:2px auto 9px;position:relative}
.monster::after{content:'';position:absolute;width:62%;height:14px;bottom:5px;left:19%;background:#031535b5;border-radius:50%;filter:blur(8px)}
.enemy-emoji{position:absolute;font-size:94px;z-index:2;filter:drop-shadow(0 9px 6px #030f3c)}
.enemy-art{height:170px;max-width:100%;object-fit:cover;border-radius:34% 34% 23% 23%;display:none;box-shadow:0 7px 24px #00aeff96}
.items{margin-top:15px}.item{border:2px solid #9eeaff;border-radius:15px;background:linear-gradient(180deg,#288fe2,#0c387a);box-shadow:0 4px 0 #052754;font-size:.83em;padding:9px 5px}.item b{font-size:1.7em}
.qtype{display:inline-block;color:#fff;background:linear-gradient(180deg,#318dd4,#094580);border:2px solid #9fdaff;padding:5px 12px;border-radius:14px;margin-bottom:9px}
.qtext{color:#122e59;font-size:1.22em;line-height:1.35}
.opt,.chip,.slot,.titem{border:3px solid #a8ceef;border-radius:17px;background:linear-gradient(180deg,#fff,#e8f4ff);box-shadow:0 4px 0 #7c9cba}
.opt:hover,.chip:hover,.tag:hover{filter:brightness(1.025);transform:translateY(-2px)}
.opt .k{background:linear-gradient(#46bcff,#0557a7);color:#fff;box-shadow:0 3px 0 #04376e;border-radius:50%;width:36px;height:36px}
.opt.ok{background:#dffcef;border-color:#38d489}.opt.bad{background:#ffe6e8;border-color:#e95563}
.scroll{border:5px solid #bc8240;background:linear-gradient(135deg,#fff8df,#fbe1a2);box-shadow:0 8px 0 #704123,0 12px 25px #0b2148a6;border-radius:23px}
.fnum{background:linear-gradient(#48bafb,#0b5fa8);box-shadow:0 3px 0 #06447d}
.cert{border:6px double #c18c26;box-shadow:inset 0 0 30px #f4d78c88}
@media(min-width:900px){.wrap{max-width:650px}.vs{min-height:315px}.hero,.sunhero{height:290px}.arena{min-height:400px}.monster{height:220px}.enemy-art{height:205px}}
@media(max-width:420px){.vs{min-height:210px}.hero,.sunhero{height:190px}.arena{min-height:310px}.monster{height:155px}.title{font-size:2rem}.card{padding:13px}}

function map(){
  clearInterval(S.timer);
  app.innerHTML = `
  <div class="dark"><h2 class="title">🗺️ Peta Pengembaraan</h2><div class="zh">冒险地图 · ${esc(S.name)} · ⭐ ${S.score}</div></div>
  <div class="map">${MONSTERS.map((m,i)=>{
     const st = i<S.lv?'done':i===S.lv?'cur':'lock';
     const stars = i<S.lv ? '⭐'.repeat(S.stars[i])+'☆'.repeat(3-S.stars[i]) : i===S.lv ? '➜' : '🔒';
     return `<div class="node ${st}"><span class="e">${i<=S.lv?m.e:'❔'}</span><span><b>Peringkat ${i+1}: ${LEVELS[i].name}</b><br><span class="zh">${i<=S.lv?m.n+' · '+m.zh:'???'}</span></span><span class="st">${stars}</span></div>`;}).join('')}</div>
  <button class="btn block" id="go">${S.lv===0?'Masuk Peringkat 1':'Teruskan'} ➜</button>`;
  $('#go').onclick=()=>{snd('tap'); scroll();};
}

function scroll(){
  const L=LEVELS[S.lv], M=MONSTERS[S.lv];
  app.innerHTML = `
  <div class="dark"><div class="stage-preview"><span class="bigemo float">${M.e}</span></div><h2>${M.n}</h2><div class="zh">${M.zh} 出现了！</div></div>
  <div class="scroll">
    <h3>📜 Gulungan Rahsia: ${L.card.title}</h3>
    <div class="zh">秘密卷轴 · ${L.card.zh}（看清楚，等一下会用到！）</div>
    ${L.card.steps.map((s,i)=>`<div class="fstep"><span class="fnum">${i+1}</span><span><b>${s[0]}</b><span class="zh">${s[1]}</span></span></div>`).join('')}
  </div>
  <button class="btn block" id="go">⚔️ LAWAN!</button>`;
  $('#go').onclick=()=>{ S.qi=0; S.lvCorrect=0; S.lvLost=0; S.mmax=Math.round(L.qs.length*10*0.75); S.mhp=S.mmax; S.dealt=0; snd('tap'); battle(); };
}

function arena(){
  const M=MONSTERS[S.lv];
  return `<div class="arena" id="arena">

function battle(){
  const Q=LEVELS[S.lv].qs[S.qi];
  S.answered=false; S.frozen=false; S.hintUsed=false;
  const typeName={mcq:'PILIH JAWAPAN · 选择题',tf:'BETUL / SALAH · 判断题',order:'SUSUN AYAT · 排序题',tag:'LABELKAN · 配对题'}[Q.t];
  app.innerHTML = arena() + `
  <div class="card" id="qc">
    <div class="qtype">${typeName}</div>
    <div class="qtext">${Q.q}</div><div class="zh">${Q.zh}</div>
    ${Q.passage?`<div class="passage">${Q.passage}</div>`:''}
    <div class="timer" id="tm"><i id="tb"></i></div>
    <div id="body"></div><div id="hint"></div><div id="fb"></div>
  </div>`;
  ({mcq:rMcq,tf:rMcq,order:rOrder,tag:rTag})[Q.t](Q);
  // items
  const ih=$('#ih'), iff=$('#if'), ic=$('#ic');
  ih.disabled=!S.items.hint; iff.disabled=!S.items.freeze; ic.disabled=!S.items.cut || !(Q.t==='mcq' && Q.opts.length>=4);
  ih.onclick=()=>{ if(S.answered||S.hintUsed)return; S.items.hint--; S.hintUsed=true; snd('tap'); ih.disabled=true; ih.innerHTML=`<b>💡</b>Petunjuk x${S.items.hint}`; $('#hint').innerHTML=`<div class="hintbox">💡 ${Q.hint}</div>`; };
  iff.onclick=()=>{ if(S.answered||S.frozen)return; S.items.freeze--; S.frozen=true; snd('tap'); iff.disabled=true; iff.innerHTML=`<b>❄️</b>Beku x${S.items.freeze}`; $('#tm').classList.add('frozen'); banner('❄️ MASA BEKU!'); };
  ic.onclick=()=>{ if(S.answered)return; S.items.cut--; snd('tap'); ic.disabled=true; ic.innerHTML=`<b>✂️</b>50:50 x${S.items.cut}`;
    const wrong=[...app.querySelectorAll('.opt')].filter(b=>b.dataset.ok!=='1'); shuffle(wrong).slice(0,2).forEach(b=>b.classList.add('gone')); };
  // timer
  S.tMax = Q.t==='order'||Q.t==='tag' ? 90 : Q.t==='tf' ? 20 : 30; S.tLeft=S.tMax;
  clearInterval(S.timer);
  S.timer=setInterval(()=>{ if(S.frozen||S.answered)return; S.tLeft-=.25; const tb=$('#tb'); if(tb) tb.style.width=Math.max(0,S.tLeft/S.tMax*100)+'%';
    if(S.tLeft<=0){ clearInterval(S.timer); resolve(false,Q,'⏰ Masa tamat!'); } },250);
}

function rMcq(Q){
  const opts = Q.t==='tf' ? [{x:'✅ Betul',ok:Q.a===true},{x:'❌ Salah',ok:Q.a===false}] : shuffle(Q.opts.map((x,i)=>({x,ok:i===Q.a})));
  if(Q.t==='mcq' && Q.opts===GRADES) opts.sort((a,b)=>GRADES.indexOf(a.x)-GRADES.indexOf(b.x));
  const show=x=>x.includes('→')?`<span class="seq">${x.split(' → ').map(p=>`<b class="sp">${p}</b>`).join('<i class="sym arr">➜</i>')}</span>`:`<span>${x}</span>`;
  $('#body').innerHTML=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}"><span class="k">${'ABCD'[i]}</span>${show(o.x)}</button>`).join('')}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(S.answered)return; const o=opts[+b.dataset.i];
    app.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true; if(opts[i].ok)x.classList.add('ok');}); if(!o.ok)b.classList.add('bad'); resolve(o.ok,Q); });
}
function rOrder(Q){
  const pool=shuffle(Q.items.map((s,i)=>({s,i}))), picked=[];
  const draw=()=>{
    $('#body').innerHTML=`<div class="zh small" style="margin-top:6px">依序点句子放进框里；点框里的句子可以拿回来。</div>
      <div class="slots">${picked.length?picked.map((p,k)=>`<button class="slot" data-k="${k}"><span class="n">${k+1}</span><span>${p.s}</span></button>`).join(''):'<div class="empty">⬇️ Tekan ayat di bawah</div>'}</div>
      <div class="pool">${pool.map((p,k)=>`<button class="chip ${picked.includes(p)?'used':''}" data-k="${k}">${p.s}</button>`).join('')}</div>
      <button class="btn blue block" id="chk" ${picked.length<Q.items.length?'disabled':''}>⚔️ SERANG!</button>`;
    app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ if(S.answered)return; snd('tap'); picked.push(pool[+b.dataset.k]); draw(); });
    app.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ if(S.answered)return; picked.splice(+b.dataset.k,1); draw(); });
    $('#chk').onclick=()=>{ const ok=picked.every((p,k)=>p.i===k);
      $('#body').innerHTML=`<div class="slots">${picked.map((p,k)=>`<div class="slot ${p.i===k?'ok':'bad'}"><span class="n">${k+1}</span><span>${p.s}</span></div>`).join('')}</div>`
        +(ok?'':`<div class="small"><b>Susunan betul / 正确顺序：</b><ol style="margin:4px 0 0;padding-left:22px">${Q.items.map(s=>`<li>${s}</li>`).join('')}</ol></div>`);
      resolve(ok,Q); };
  }; draw();
}
function rTag(Q){
  const items=shuffle(Q.items.map((it,i)=>({...it,i}))), ch=items.map(()=>null);
  const draw=()=>{
    $('#body').innerHTML=items.map((it,k)=>`<div class="titem" id="ti${k}"><div class="s">${it.s}</div><div class="tags">${Q.tags.map(t=>`<button class="tag ${ch[k]===t?'sel':''}" data-k="${k}" data-t="${t}">${t}</button>`).join('')}</div></div>`).join('')
      +`<button class="btn blue block" id="chk" ${ch.includes(null)?'disabled':''}>⚔️ SERANG!</button>`;
    app.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{ if(S.answered)return; snd('tap'); ch[+b.dataset.k]=b.dataset.t; draw(); });
    $('#chk').onclick=()=>{ let ok=true;
      items.forEach((it,k)=>{ const el=$('#ti'+k), g=ch[k]===it.a; if(!g)ok=false; el.classList.add(g?'ok':'bad'); el.querySelectorAll('.tag').forEach(t=>t.disabled=true);
        if(!g) el.insertAdjacentHTML('beforeend',`<div class="fix">✏️ Jawapan: ${it.a}</div>`); });
      $('#chk').remove(); resolve(ok,Q); };
  }; draw();
}

function resolve(ok,Q,msg){
  if(S.answered)return; S.answered=true; clearInterval(S.timer);
  app.querySelectorAll('.opt,.chip,.slot,.tag,#chk').forEach(b=>{b.disabled=true;});
  app.querySelectorAll('.item').forEach(b=>b.disabled=true);
  S.total++;
  const M=MONSTERS[S.lv], mon=$('#mon');
  let head, sub;
  if(ok){
    S.correct++; S.lvCorrect++; S.combo++; S.best=Math.max(S.best,S.combo);
    const crit = !S.frozen && S.tLeft >= S.tMax*0.5;
    let dmg = crit?15:10; let pts = (S.hintUsed?5:10) + (crit?5:0) + (S.combo>=3?5:0);
    S.score+=pts; S.dealt+=dmg;
    mon.classList.remove('hit'); void mon.offsetWidth; mon.classList.add('hit');
    pop(crit?`CRITICAL! -${dmg}`:`-${dmg}`, crit?'#ffd23f':'#fff');
    snd(crit?'crit':'hit'); particles(['⚔️','❄️','✨','💥']);
    if(crit) banner('💥 CRITICAL!');
    head=`⚔️ Serangan berjaya! +${pts} mata`; sub = crit?'答得快，暴击！':(S.combo>=3?`连击 ${S.combo}！额外加分 🔥`:'答对了，打中怪兽！');
  } else {
    S.combo=0; S.hearts--; S.lvLost++;
    mon.classList.remove('atk'); void mon.offsetWidth; mon.classList.add('atk');
    snd('hurt'); document.body.insertAdjacentHTML('beforeend','<div class="redflash"></div>'); setTimeout(()=>document.querySelector('.redflash')?.remove(),450);
    $('#arena').classList.add('shake'); pop('-1 ❤️','#ff5a5f',true);
    head = msg || `💥 ${M.atk}`; sub = '答错了，被怪兽打中！看看重点再继续。';
  }
  // monster cannot fall before the last question (all questions must be played)
  const lastQ = S.qi>=LEVELS[S.lv].qs.length-1;
  S.mhp = S.mmax - S.dealt; if(!lastQ && S.mhp<=0){ S.mhp = Math.max(1,S.mmax*0.04); if(ok) sub+=' 怪兽只剩一口气，撑到最后一题！'; }
  // refresh bars
  $('#mhp').style.width=Math.max(0,S.mhp/S.mmax*100)+'%';
  $('#hearts').textContent='❤️'.repeat(Math.max(0,S.hearts))+'🖤'.repeat(MAXH-Math.max(0,S.hearts));
  $('#combo').textContent=S.combo>=2?'🔥 COMBO x'+S.combo:''; $('#sc').textContent=S.score;
  const killed = lastQ && S.dealt>=S.mmax;
  const last = S.qi>=LEVELS[S.lv].qs.length-1;
  let label='Seterusnya ➜';
  if(S.hearts<=0) label='💀 …'; else if(killed) label='🏆 Kalahkan raksasa!'; else if(last) label='Tamat pertarungan ➜';
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${head}</h3><div class="zh">${sub}</div><div class="note">${Q.note}</div>
    <button class="btn block" id="nx">${label}</button></div>`;
  $('#nx').onclick=()=>{ snd('tap'); next(killed,last); };
  setTimeout(()=>$('#fb')?.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
}

function next(killed,last){
  if(S.hearts<=0) return gameOver();
  if(killed||last) return victory(killed);
  S.qi++; battle(); window.scrollTo({top:0,behavior:'smooth'});
}

function victory(killed){
  const L=LEVELS[S.lv], M=MONSTERS[S.lv];
  const acc=S.lvCorrect/L.qs.length;
  let stars = killed ? (acc===1?3:acc>=.75?2:1) : 0;
  // remaining questions skipped when killed early count as fine
  S.stars[S.lv]=stars; S.score+= stars*10;
  snd(killed?'win':'lose');
  const bonusHeart = killed && S.hearts<MAXH && stars===3;
  if(bonusHeart) S.hearts++;
  const isLast = S.lv===LEVELS.length-1;
  app.innerHTML = `
  <div class="dark" style="margin-top:20px">
    <div class="bigemo ${killed?'':'float'}" style="${killed?'opacity:.35;transform:rotate(180deg)':''}">${M.e}</div>
    <div class="title" style="font-size:1.7em">${killed?'MENANG!':'Raksasa melarikan diri…'}</div>
    <div class="zh">${killed?`你打败了 ${M.zh}！`:'怪兽逃走了，没拿到星星，但可以继续前进！'}</div>
  </div>
  <div class="card">
    <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.2}s">${i<stars?'⭐':'☆'}</span>`).join('')}</div>
    <div class="stat"><div><b>${S.lvCorrect}/${S.qi+1}</b>Betul</div><div><b>${S.score}</b>Mata</div><div><b>${'❤️'.repeat(S.hearts)||'0'}</b>Nyawa</div></div>
    ${stars?`<div class="zh center" style="text-align:center">+${stars*10} 星星奖励${bonusHeart?' · ❤️ 3 星奖励：恢复一颗心！':''}</div>`:''}
    <div class="scroll" style="margin-top:10px"><b>📌 Ingat! 记住：</b>
      ${L.card.steps.map(s=>`<div class="small" style="margin-top:4px">• <b>${s[0]}</b> <span class="zh">${s[1]}</span></div>`).join('')}</div>
    <button class="btn block" id="go">${isLast?'🏆 Lihat Sijil':'🗺️ Ke peta'}</button>
  </div>`;
  if(killed) particles(['⭐','✨','🎉','❄️'],24);
  $('#go').onclick=()=>{ snd('tap'); if(isLast) end(); else { S.lv++; map(); } };
}

function gameOver(){
  snd('lose');
  app.innerHTML = `
  <div class="dark" style="margin-top:40px"><div class="bigemo">💧</div><div class="title" style="font-size:1.8em">Pahlawan Cair!</div>
  <div class="zh">冰淇淋勇者融化了……</div></div>
  <div class="card" style="text-align:center">
    <p>Jangan putus asa! Hidupkan semula dengan <b>-30 mata</b> dan teruskan pertarungan.</p>
    <div class="zh">别放弃！扣 30 分就可以复活，继续战斗。</div>
    <button class="btn block blue" id="rv">❄️ Hidup Semula (${MAXH} ❤️)</button>
  </div>`;
  $('#rv').onclick=()=>{ S.hearts=MAXH; S.score=Math.max(0,S.score-30); S.revives++; snd('win');
    const L=LEVELS[S.lv]; if(S.qi>=L.qs.length-1) victory(S.dealt>=S.mmax); else { S.qi++; battle(); } };
}

function wc(arr){ return arr.join(' ').split(/\s+/).filter(Boolean).length; }
function para(arr,label){ return `<p><b class="small">${label}</b> <span class="wc">(${wc(arr)} patah)</span><br>${arr.map((s,i)=>`<span class="r r${i%5}">${s}</span>`).join(' ')}</p>`; }

function end(){
  const acc=Math.round(S.correct/S.total*100);
  const R=RANKS.find(r=>acc>=r[0]);
  const totalStars=S.stars.reduce((a,b)=>a+b,0);
  const d=new Date(); const ds=`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  app.innerHTML = `
  <div class="dark" style="margin-top:16px"><div class="vs">${HERO}<span class="bigemo" style="opacity:.4;transform:rotate(180deg)">🌞</span></div>
  <div class="title" style="font-size:1.6em">${S.stars[5]?'Malaysia sejuk semula! ❄️':'Raja Matahari melarikan diri…'}</div><div class="zh">${S.stars[5]?'太阳魔王被打败了！':'太阳魔王逃走了，再挑战一次吧！'}</div></div>
  <div class="card cert">
    <div class="zh">SIJIL PAHLAWAN · 勇者证书</div>
    <div>Dengan ini diakui bahawa</div>
    <div class="nm">${esc(S.name)}</div>
    <div>telah menamatkan misi <b>Karangan Respons Terhad</b></div>
    <div style="margin:8px 0"><span class="rank">${R[1]}</span> <span class="zh">${R[2]}</span></div>
    <div class="stat"><div><b>${S.score}</b>Mata</div><div><b>${acc}%</b>Ketepatan</div><div><b>${totalStars}/18</b>⭐</div><div><b>${S.best}</b>Combo</div></div>
    <div class="small zh">${ds} · Jawapan betul ${S.correct}/${S.total}${S.revives?` · Hidup semula ${S.revives}x`:''}</div>
    <div class="small zh" style="margin-top:4px">📸 截图这张证书交给老师！</div>
  </div>
  <div class="card">
    <h3>📋 Kad Rumusan <span class="zh">重点总复习</span></h3>
    <div class="fstep"><span class="fnum">P</span><span><b>Pendahuluan (4)</b><span class="zh">Maksud tema → Situasi semasa → Tindakan → Persoalannya, apakah [TAJUK]?</span></span></div>
    <div class="fstep"><span class="fnum">I</span><span><b>Idea (5)</b><span class="zh">Isi utama → Sebab → Contoh → Kesan → Kesimpulan ringkas</span></span></div>
    <div class="fstep"><span class="fnum">T</span><span><b>Penutup (4)</b><span class="zh">Kesimpulan → Tindakan → Peribahasa → Harapan</span></span></div>
    <div class="fstep"><span class="fnum">⚠</span><span><b>Ingat!</b><span class="zh">150-200 patah · 每段 45-50 · 用完全部 Bahan · 不可写点式</span></span></div>
  </div>
  <div class="card model">
    <h3>📝 Karangan Contoh <span class="zh">范文（${wc([...P_PEND,...P_ISI1,...P_ISI2,...P_TUTUP])} patah）</span></h3>
    ${para(P_PEND,'Pendahuluan')}${para(P_ISI1,'Isi 1')}${para(P_ISI2,'Isi 2')}${para(P_TUTUP,'Penutup')}
  </div>
  <button class="btn block" id="again">🔁 Main Semula</button>`;
  particles(['🎉','⭐','❄️','🏆','✨'],40); snd('win');
  $('#again').onclick=home; window.scrollTo({top:0});
}

/* ============ FX ============ */
function pop(txt,color,onHero){
  const a=$('#arena'); if(!a)return; const d=document.createElement('div'); d.className='dmg'; d.textContent=txt; d.style.color=color;
  d.style.left=onHero?'14px':'50%'; d.style.top=onHero?'60%':'30%'; if(!onHero)d.style.transform='translateX(-50%)';
  a.appendChild(d); setTimeout(()=>d.remove(),1000);
}
function particles(em,n=12){
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='particle'; d.textContent=em[i%em.length];
    d.style.left=(innerWidth/2)+'px'; d.style.top=(innerHeight/3)+'px';
    d.style.setProperty('--dx',(Math.random()*340-170)+'px'); d.style.setProperty('--dy',(Math.random()*300-200)+'px');
    document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }
}
function banner(t){ const d=document.createElement('div'); d.className='banner'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1200); }

function fixSyms(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), list=[];
  while(w.nextNode()){ const n=w.currentNode; if(/[·→]/.test(n.nodeValue) && !n.parentNode.classList.contains('sym')) list.push(n); }
  list.forEach(n=>{ const f=document.createDocumentFragment();
    n.nodeValue.split(/([·→])/).forEach(x=>{ if(!x)return; if(x==='·'||x==='→'){const i=document.createElement('i');i.className='sym';i.textContent=x;f.appendChild(i);} else f.appendChild(document.createTextNode(x)); });
    n.parentNode.replaceChild(f,n); });
}
new MutationObserver(()=>fixSyms(app)).observe(app,{childList:true,subtree:true});
home();
</script>
