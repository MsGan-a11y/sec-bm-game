ali. Pusingan dimenangi bila tali cukup jauh.<\/p>\n      <span class=\"tag\">Sehingga ~40 murid<\/span><span class=\"tag\">Kod bilik<\/span><\/div><\/a>\n  <\/div>\n<\/div>\n\n<script>\n  const cur = G.$('#cur'), preview = G.$('#preview'), msg = G.$('#msg');\n  function paint() {\n    const s = G.loadSet();\n    cur.innerHTML = `📚 ${G.esc(s.title)} <small>· ${s.questions.length} soalan<\/small>`;\n    preview.innerHTML = s.questions.slice(0, 50).map(q => `<li>${G.fmt(q.q)} — <b>${q.correct.map(G.fmt).join(' / ')}<\/b>${q.wrong.length ? '' : ' <i>(isi tempat kosong)<\/i>'}<\/li>`).join('');\n  }\n  async function handle(file) {\n    msg.innerHTML = '';\n    try {\n      const r = await G.importFile(file);\n      msg.innerHTML = `<p>✅ ${r.questions.length} soalan diimport (format ${r.format})${r.skipped ? `, ${r.skipped} baris dilangkau (tiada jawapan betul)` : ''}.<\/p>`;\n      paint();\n    } catch (e) { msg.innerHTML = `<p class=\"err\">⚠ ${G.esc(e.message)}<\/p>`; }\n  }\n  G.$('#file').onchange = e => e.target.files[0] && handle(e.target.files[0]);\n  const drop = G.$('#drop');\n  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };\n  drop.ondragleave = () => drop.classList.remove('over');\n  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && handle(e.dataTransfer.files[0]); };\n  G.$('#tpl').onclick = () => G.downloadTemplate();\n  G.$('#reset').onclick = () => { G.clearSet(); msg.innerHTML = ''; paint(); };\n  const st = G.settings();\n  G.$('#optTimer').checked = st.timer; G.$('#optSound').checked = st.sound;\n  G.$('#optTimer').onchange = e => G.saveSettings(Object.assign(G.settings(), { timer: e.target.checked }));\n  G.$('#optSound').onchange = e => G.saveSettings(Object.assign(G.settings(), { sound: e.target.checked }));\n  paint();\n<\/script>\n<\/body>\n<\/html>\n", "tiles": "<!DOCTYPE html>\n<html lang=\"ms\">\n<head>\n__INJECT__\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;\n  var m = a.getAttribute('href').match(/^([\\w-]+)\\.html(\\?.*)?$/);\n  if (m) { e.preventDefault(); parent.postMessage({ arkedGo: m[1], q: m[2] || '' }, '*'); }\n}, true);\n<\/script>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Petak Rahsia<\/title>\n<style>@@common.css@@<\/style>\n<script>@@common.js@@<\/script>\n<style>\n  .game{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:18px;max-width:1400px;margin:0 auto}\n  .turn{font-size:22px;font-weight:800;margin-bottom:10px}\n  .board{display:grid;gap:12px;grid-template-columns:repeat(var(--cols),1fr)}\n  .tile{perspective:800px;aspect-ratio:1.45;cursor:pointer}\n  .tile .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}\n  .tile.open .in{transform:rotateY(180deg)}\n  .tile .f,.tile .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;font-weight:800}\n  .tile .f{background:linear-gradient(145deg,#2c4bd8,#1a2c88);border:3px solid #ffffff30;font-size:clamp(28px,4vw,56px);box-shadow:inset 0 -6px 0 #0004}\n  .tile:not(.open):hover .f{background:linear-gradient(145deg,#3b5cf0,#2238a8);transform:translateY(-3px)}\n  .tile .b{transform:rotateY(180deg);background:#fff;color:#1a2040;font-size:clamp(18px,2.4vw,30px);text-align:center;padding:6px}\n  .tile .b .ic{font-size:clamp(28px,3.6vw,48px)}\n  .tile .b small{font-size:.55em;color:#555;font-weight:700}\n  .tile.miss .b{background:#5a6080;color:#ddd}.tile.miss .b small{color:#ddd}\n  .tile.open{cursor:default}\n  .tile .own{position:absolute;top:6px;right:8px;font-size:22px;backface-visibility:hidden;transform:rotateY(180deg)}\n  .legend{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.6}\n  @media (max-width:800px){.game{grid-template-columns:1fr}}\n<\/style>\n<\/head>\n<body>\n<div class=\"topbar\"><a class=\"btn\" href=\"index.html\">🏠<\/a><div class=\"brand\">🎴 Petak <b>Rahsia<\/b><\/div><div class=\"spacer\"><\/div>\n  <span id=\"left\" style=\"color:var(--muted)\"><\/span><button class=\"btn\" id=\"end\" style=\"display:none\">🏁 Tamat<\/button><\/div>\n<div id=\"root\"><\/div>\n\n<script>\nconst SPECIALS = {\n  bonus:  { ic: '🎁', label: 'Bonus +50' },\n  steal:  { ic: '🦊', label: 'Curi 20' },\n  swap:   { ic: '🔄', label: 'Tukar Markah' },\n  trap:   { ic: '🕳️', label: 'Perangkap −20' },\n  double: { ic: '✖️2', label: 'Ganda Dua' },\n  give:   { ic: '🎀', label: 'Hadiah +20 untuk lawan' },\n};\nfunction buildTiles(n) {\n  const sp = n <= 8 ? ['bonus', 'steal', 'trap'] :\n             n <= 12 ? ['bonus', 'steal', 'trap', 'double'] :\n             n <= 16 ? ['bonus', 'steal', 'trap', 'double', 'swap', 'give'] :\n                       ['bonus', 'bonus', 'steal', 'steal', 'trap', 'trap', 'double', 'swap', 'give'];\n  const tiles = sp.map(k => ({ type: k }));\n  while (tiles.length < n) tiles.push({ type: 'pts', v: [10, 10, 20, 20, 30, 40][G.rand(0, 5)] });\n  return G.shuffle(tiles);\n}\n\nG.setup(G.$('#root'), {\n  icon: '🎴', title: 'Petak Rahsia',\n  desc: 'Pasukan bergilir memilih petak. Jawab betul untuk buka ganjaran di sebalik petak — mata, bonus, curi, tukar markah, atau perangkap!',\n  tags: ['Dipimpin guru', '2–6 pasukan'],\n  options: [\n    { key: 'teams', label: 'Bilangan pasukan', def: 4, choices: [2, 3, 4, 5, 6].map(v => ({ v, label: v, sub: 'pasukan' })) },\n    { key: 'tiles', label: 'Bilangan petak', def: 16, choices: [[8, '4×2'], [12, '4×3'], [16, '4×4'], [24, '6×4']].map(([v, s]) => ({ v, label: v, sub: s })) },\n  ],\n  onStart: start,\n});\n\nfunction start(opt, set) {\n  const teams = G.makeTeams(opt.teams), deck = G.deck(set.questions);\n  const tiles = buildTiles(opt.tiles);\n  const cols = opt.tiles === 24 ? 6 : 4;\n  let cur = 0, busy = false;\n  G.$('#end').style.display = '';\n  G.$('#end').onclick = () => G.winner(teams);\n  const root = G.$('#root');\n  root.innerHTML = `<div class=\"game\"><div><div class=\"turn\" id=\"turn\"><\/div><div class=\"teams\" id=\"teams\"><\/div>\n    <div class=\"legend\">${Object.values(SPECIALS).map(s => `${s.ic} ${s.label}`).join('<br>')}<br>🔢 Mata biasa 10–40<br><br>Petua: tuding nama pasukan untuk ubah markah (±5).<\/div><\/div>\n    <div class=\"board\" style=\"--cols:${cols}\">${tiles.map((t, i) => `<div class=\"tile\" data-i=\"${i}\"><div class=\"in\"><div class=\"f\">${i + 1}<\/div><div class=\"b\"><\/div><\/div><\/div>`).join('')}<\/div><\/div>`;\n  const teamsEl = G.$('#teams');\n  const paint = () => {\n    G.renderTeams(teamsEl, teams, cur);\n    G.$('#turn').innerHTML = `Giliran: <span style=\"color:${teams[cur].color}\">${teams[cur].emoji} ${teams[cur].name}<\/span>`;\n    G.$('#left').textContent = `${tiles.filter(t => !t.open).length} petak lagi`;\n  };\n  paint();\n\n  root.querySelectorAll('.tile').forEach(el => el.onclick = async () => {\n    const t = tiles[+el.dataset.i];\n    if (busy || t.open) return;\n    busy = true; G.sfx.click();\n    const team = teams[cur];\n    const ok = await G.ask(deck.next(), { team, label: `Petak ${+el.dataset.i + 1}` });\n    t.open = true;\n    const back = el.querySelector('.b');\n    if (t.type === 'pts') back.innerHTML = `<span class=\"ic\">${t.v}<\/span><small>mata<\/small>`;\n    else back.innerHTML = `<span class=\"ic\">${SPECIALS[t.type].ic}<\/span><small>${SPECIALS[t.type].label}<\/small>`;\n    if (!ok) { el.classList.add('miss'); back.innerHTML += '<small>Terlepas!<\/small>'; }\n    el.classList.add('open');\n    await G.sleep(650);\n    if (ok) await apply(t, team, el);\n    cur = (cur + 1) % teams.length; paint(); busy = false;\n    if (tiles.every(t => t.open)) setTimeout(() => G.winner(teams), 600);\n  });\n\n  async function apply(t, team, el) {\n    const others = teams.filter(x => x !== team);\n    switch (t.type) {\n      case 'pts': team.score += t.v; G.burstAt(el); G.toast(`${team.emoji} +${t.v}`); break;\n      case 'bonus': team.score += 50; G.burstAt(el, ['🎁', '⭐', '💰'], 30); G.toast(`${team.emoji} Bonus +50!`); break;\n      case 'trap': team.score -= 20; G.sfx.bad(); G.shake(el); G.toast(`${team.emoji} Perangkap! −20`); break;\n      case 'double': {\n        const add = Math.min(Math.max(team.score, 10), 60); team.score += add;\n        G.burstAt(el); G.toast(`${team.emoji} Ganda dua! +${add}`); break;\n      }\n      case 'steal': {\n        paint();\n        const v = await G.pickTeam(teams, `🦊 ${team.name}: curi 20 mata dari siapa?`, teams.indexOf(team));\n        const amt = 20;\n        teams[v].score -= amt; team.score += amt; G.toast(`🦊 ${team.name} curi ${amt} dari ${teams[v].name}!`); break;\n      }\n      case 'swap': {\n        paint();\n        const v = await G.pickTeam(teams, `🔄 ${team.name}: tukar markah dengan siapa?`, teams.indexOf(team));\n        [team.score, teams[v].score] = [teams[v].score, team.score]; G.toast(`🔄 ${team.name} ⇄ ${teams[v].name}`); break;\n      }\n      case 'give': {\n        paint();\n        const v = await G.pickTeam(teams, `🎀 ${team.name}: beri 20 mata kepada siapa?`, teams.indexOf(team));\n        teams[v].score += 20; G.toast(`🎀 ${teams[v].name} +20`); break;\n      }\n    }\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "bomb": "<!DOCTYPE html>\n<html lang=\"ms\">\n<head>\n__INJECT__\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;\n  var m = a.getAttribute('href').match(/^([\\w-]+)\\.html(\\?.*)?$/);\n  if (m) { e.preventDefault(); parent.postMessage({ arkedGo: m[1], q: m[2] || '' }, '*'); }\n}, true);\n<\/script>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Bom Jangka<\/title>\n<style>@@common.css@@<\/style>\n<script>@@common.js@@<\/script>\n<style>\n  body{background:radial-gradient(1000px 600px at 50% -10%,#7a1f3d 0%,transparent 60%),linear-gradient(160deg,#1a0f24,#2b1340);background-attachment:fixed}\n  .game{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:18px;max-width:1400px;margin:0 auto}\n  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;min-height:60px;background:#0005;border-radius:18px;padding:10px 16px}\n  .bar .info{font-size:22px;font-weight:800;flex:1}\n  .pot{font-size:24px;font-weight:800;color:var(--gold)}\n  .board{display:grid;gap:12px;grid-template-columns:repeat(var(--cols),1fr)}\n  .box{aspect-ratio:1.3;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;position:relative;\n       background:linear-gradient(160deg,#c8873a,#8a5520);border:3px solid #ffd59a55;box-shadow:inset 0 -8px 0 #0004;font-size:clamp(22px,3vw,40px);transition:all .25s;color:#fff3dd}\n  .box::before{content:'';position:absolute;left:0;right:0;top:42%;height:10%;background:#5a360f88}\n  .box span{position:relative}\n  .board.armed .box:not(.open){cursor:pointer;animation:glow 1.2s infinite alternate}\n  .board.armed .box:not(.open):hover{transform:translateY(-4px) scale(1.03)}\n  @keyframes glow{to{box-shadow:inset 0 -8px 0 #0004,0 0 22px #ffc93c}}\n  .box.open{background:#ffffff14;border-color:#ffffff22;box-shadow:none;cursor:default}\n  .box.open::before{display:none}\n  .box.open.bomb{background:#ff3b3b55}\n  .box.open small{font-size:.45em;color:var(--muted)}\n  .shield{font-size:18px}\n  @media (max-width:800px){.game{grid-template-columns:1fr}}\n<\/style>\n<\/head>\n<body>\n<div class=\"topbar\"><a class=\"btn\" href=\"index.html\">🏠<\/a><div class=\"brand\">💣 Bom <b>Jangka<\/b><\/div><div class=\"spacer\"><\/div>\n  <span id=\"left\" style=\"color:var(--muted)\"><\/span><button class=\"btn\" id=\"end\" style=\"display:none\">🏁 Tamat<\/button><\/div>\n<div id=\"root\"><\/div>\n<script>\nG.setup(G.$('#root'), {\n  icon: '💣', title: 'Bom Jangka',\n  desc: 'Jawab betul untuk buka satu peti. Dapat mata? Simpan sekarang atau berani buka lagi tanpa soalan. Jumpa bom — mata giliran itu hangus, malah markah simpanan pun boleh lenyap! 🛡 Perisai menyelamatkan anda sekali.',\n  tags: ['Dipimpin guru', '2–6 pasukan', 'Berani atau tidak?'],\n  options: [\n    { key: 'teams', label: 'Bilangan pasukan', def: 4, choices: [2, 3, 4, 5, 6].map(v => ({ v, label: v, sub: 'pasukan' })) },\n    { key: 'tiles', label: 'Bilangan peti', def: 16, choices: [[12, '4×3'], [16, '4×4'], [24, '6×4']].map(([v, s]) => ({ v, label: v, sub: s })) },\n    { key: 'rule', label: 'Bila kena bom', def: 'half', choices: [{ v: 'half', label: 'Hilang separuh', sub: 'markah simpanan' }, { v: 'all', label: 'Hilang semua', sub: 'markah simpanan' }, { v: 'pot', label: 'Mata giliran sahaja', sub: 'mesra' }] },\n  ],\n  onStart: start,\n});\n\nfunction start(opt, set) {\n  const teams = G.makeTeams(opt.teams).map(t => Object.assign(t, { shield: 0 })), deck = G.deck(set.questions);\n  const nb = Math.max(2, Math.round(opt.tiles / 6)), ns = opt.tiles >= 24 ? 2 : 1;\n  let boxes = [...Array(nb)].map(() => ({ type: 'bomb' })).concat([...Array(ns)].map(() => ({ type: 'shield' })));\n  while (boxes.length < opt.tiles) boxes.push({ type: 'pts', v: [10, 10, 20, 20, 30, 50][G.rand(0, 5)] });\n  boxes = G.shuffle(boxes);\n  const cols = opt.tiles === 24 ? 6 : 4;\n  let cur = 0, pot = 0, phase = 'ask'; // ask | pick | decide | busy\n  G.$('#end').style.display = '';\n  G.$('#end').onclick = () => G.winner(teams);\n\n  G.$('#root').innerHTML = `<div class=\"game\"><div><div class=\"teams\" id=\"teams\"><\/div>\n    <p style=\"color:var(--muted);font-size:14px\">💣 ${nb} bom tersembunyi · 🛡 ${ns} perisai<\/p><\/div>\n    <div><div class=\"bar\"><div class=\"info\" id=\"info\"><\/div><div class=\"pot\" id=\"pot\"><\/div><div id=\"act\"><\/div><\/div>\n    <div class=\"board\" id=\"board\" style=\"--cols:${cols}\">${boxes.map((b, i) => `<div class=\"box\" data-i=\"${i}\"><span>${i + 1}<\/span><\/div>`).join('')}<\/div><\/div><\/div>`;\n  const board = G.$('#board');\n\n  function paint() {\n    const t = teams[cur];\n    G.renderTeams(G.$('#teams'), teams, cur, x => x.shield ? '<span class=\"shield\">🛡<\/span>' : '');\n    G.$('#pot').textContent = pot ? `Mata giliran: ${pot}` : '';\n    board.classList.toggle('armed', phase === 'pick');\n    const safeLeft = boxes.filter(b => !b.open && b.type !== 'bomb').length;\n    G.$('#left').textContent = `${boxes.filter(b => !b.open).length} peti lagi`;\n    const act = G.$('#act'), info = G.$('#info');\n    const tn = `<span style=\"color:${t.color}\">${t.emoji} ${t.name}<\/span>`;\n    if (phase === 'ask') { info.innerHTML = `Giliran ${tn}`; act.innerHTML = `<button class=\"btn gold big\" id=\"q\">❓ Soalan<\/button>`; G.$('#q').onclick = askQ; }\n    else if (phase === 'pick') { info.innerHTML = `${tn}: pilih satu peti!`; act.innerHTML = ''; }\n    else if (phase === 'decide') {\n      info.innerHTML = `${tn}: simpan atau buka lagi?`;\n      act.innerHTML = `<button class=\"btn teal big\" id=\"bank\">💰 Simpan ${pot}<\/button> <button class=\"btn coral big\" id=\"more\" ${safeLeft ? '' : 'disabled'}>🎲 Buka lagi<\/button>`;\n      G.$('#bank').onclick = bank; G.$('#more').onclick = () => { phase = 'pick'; G.sfx.click(); paint(); };\n    } else { act.innerHTML = ''; }\n  }\n  function next() {\n    pot = 0; cur = (cur + 1) % teams.length; phase = 'ask';\n    if (!boxes.some(b => !b.open && b.type !== 'bomb')) { paint(); return setTimeout(() => G.winner(teams), 500); }\n    paint();\n  }\n  async function askQ() {\n    phase = 'busy'; paint();\n    const ok = await G.ask(deck.next(), { team: teams[cur] });\n    if (ok) { phase = 'pick'; paint(); } else next();\n  }\n  function bank() { const t = teams[cur]; t.score += pot; G.toast(`${t.emoji} simpan +${pot}`); G.sfx.good(); next(); }\n\n  board.querySelectorAll('.box').forEach(el => el.onclick = async () => {\n    const b = boxes[+el.dataset.i]; if (phase !== 'pick' || b.open) return;\n    b.open = true; phase = 'busy'; el.classList.add('open'); const t = teams[cur];\n    if (b.type === 'pts') {\n      el.innerHTML = `<span>+${b.v}<\/span>`; pot += b.v; G.sfx.good(); G.burstAt(el, ['💰', '✨'], 10);\n      phase = 'decide'; paint();\n    } else if (b.type === 'shield') {\n      el.innerHTML = `<span>🛡<\/span><small>Perisai<\/small>`; t.shield = 1; G.sfx.good(); G.toast(`${t.emoji} dapat perisai!`);\n      phase = pot ? 'decide' : 'pick'; if (!boxes.some(x => !x.open && x.type !== 'bomb')) phase = 'decide'; paint();\n    } else {\n      el.classList.add('bomb'); el.innerHTML = `<span>💥<\/span>`; G.sfx.boom(); G.shake(document.body); G.burstAt(el, ['💥', '🔥', '💨'], 26);\n      paint();\n      await G.sleep(700);\n      if (t.shield) { t.shield = 0; await G.message(`🛡 Perisai ${t.emoji} ${t.name} menahan letupan!<br><small>Mata giliran (${pot}) hilang, markah simpanan selamat.<\/small>`); }\n      else {\n        const before = t.score;\n        if (opt.rule === 'all') t.score = Math.min(t.score, 0);\n        if (opt.rule === 'half') t.score = Math.floor(t.score / 2);\n        await G.message(`💣 BOOM! ${t.emoji} ${t.name} hilang ${pot} mata giliran${before !== t.score ? ` dan ${before - t.score} mata simpanan` : ''}!`);\n      }\n      next();\n    }\n  });\n  paint();\n}\n<\/script>\n<\/body>\n<\/html>\n", "castle": "<!DOCTYPE html>\n<html lang=\"ms\">\n<head>\n__INJECT__\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;\n  var m = a.getAttribute('href').match(/^([\\w-]+)\\.html(\\?.*)?$/);\n  if (m) { e.preventDefault(); parent.postMessage({ arkedGo: m[1], q: m[2] || '' }, '*'); }\n}, true);\n<\/script>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Serang Kubu<\/title>\n<style>@@common.css@@<\/style>\n<script>@@common.js@@<\/script>\n<style>\n  body{background:linear-gradient(180deg, id=\"left\"><\/span><button class=\"btn\" id=\"end\" style=\"display:none\">🏁 Tamat<\/button><\/div>\n<div id=\"root\"><\/div>\n<script>\nconst castleSVG = c => `<svg viewBox=\"0 0 200 170\">\n  <g stroke=\"#2a2a35\" stroke-width=\"3\" stroke-linejoin=\"round\">\n    <path d=\"M100 8 v28\" /><path d=\"M100 10 l26 8 -26 8z\" fill=\"${c}\"/>\n    <rect x=\"20\" y=\"70\" width=\"160\" height=\"95\" fill=\"#c9c4b8\"/>\n    <rect x=\"8\" y=\"40\" width=\"48\" height=\"125\" fill=\"#d8d3c7\"/><rect x=\"144\" y=\"40\" width=\"48\" height=\"125\" fill=\"#d8d3c7\"/>\n    <rect x=\"72\" y=\"36\" width=\"56\" height=\"129\" fill=\"#e3ded2\"/>\n    ${[8, 24, 40].map(x => `<rect x=\"${x}\" y=\"28\" width=\"12\" height=\"14\" fill=\"#d8d3c7\"/>`).join('')}\n    ${[144, 160, 176].map(x => `<rect x=\"${x}\" y=\"28\" width=\"12\" height=\"14\" fill=\"#d8d3c7\"/>`).join('')}\n    ${[72, 94, 116].map(x => `<rect x=\"${x}\" y=\"24\" width=\"12\" height=\"14\" fill=\"#e3ded2\"/>`).join('')}\n    <path d=\"M82 165 v-34 a18 18 0 0 1 36 0 v34z\" fill=\"#5b3a1e\"/>\n    <rect x=\"24\" y=\"70\" width=\"16\" height=\"22\" rx=\"8\" fill=\"#2a2a35\"/><rect x=\"160\" y=\"70\" width=\"16\" height=\"22\" rx=\"8\" fill=\"#2a2a35\"/>\n    <rect x=\"90\" y=\"60\" width=\"20\" height=\"26\" rx=\"10\" fill=\"${c}\"/>\n  <\/g>\n  <g class=\"crack\" stroke=\"#3a3030\" stroke-width=\"3\" fill=\"none\">\n    <path d=\"M30 100 l12 14 -6 10 12 16\"/><path d=\"M160 60 l-10 18 8 12 -6 14\"/><path d=\"M120 120 l14 6 -4 16\"/>\n  <\/g><\/svg>`;\n\nG.setup(G.$('#root'), {\n  icon: '🏰', title: 'Serang Kubu',\n  desc: 'Pasukan bergilir menjawab. Jawab betul → pilih 🎯 lontar batu ke kubu lawan (−25 HP) atau 🔨 baiki kubu sendiri (+15 HP). Runtuhkan kubu untuk 👑 mahkota. Kubu dibina semula, jadi tiada siapa tersingkir!',\n  tags: ['Dipimpin guru', '2–4 pasukan', 'Strategi'],\n  options: [\n    { key: 'teams', label: 'Bilangan kubu', def: 3, choices: [2, 3, 4].map(v => ({ v, label: v, sub: 'kubu' })) },\n    { key: 'q', label: 'Bilangan soalan', def: 16, choices: [8, 12, 16, 24].map(v => ({ v, label: v, sub: 'soalan' })) },\n  ],\n  onStart: start,\n});\n\nfunction start(opt, set) {\n  const teams = G.makeTeams(opt.teams).map(t => Object.assign(t, { hp: 100, crowns: 0 }));\n  const deck = G.deck(set.questions);\n  let cur = 0, asked = 0, busy = false;\n  const rankSort = (a, b) => (b.crowns - a.crowns) || (b.hp - a.hp);\n  const finish = () => G.winner(teams, t => `👑 ${t.crowns} · ❤ ${t.hp}`, rankSort);\n  G.$('#end').style.display = ''; G.$('#end').onclick = finish;\n\n  G.$('#root').innerHTML = `<div class=\"field\">${teams.map((t, i) => `<div class=\"castle\" id=\"c${i}\" style=\"--tc:${t.color}\">\n      <div class=\"smoke\">💨<\/div>${castleSVG(t.color)}\n      <div class=\"hp\"><i><\/i><\/div><div class=\"meta\"><span class=\"cr\"><\/span><\/div>\n      <div class=\"tag\">${t.emoji} ${t.name}<\/div><\/div>`).join('')}<\/div>\n    <div class=\"panel\"><div class=\"info\" id=\"info\"><\/div><button class=\"btn gold big\" id=\"go\">❓ Soalan<\/button><\/div>`;\n\n  function paint() {\n    teams.forEach((t, i) => {\n      const el = G.$('#c' + i);\n      el.classList.toggle('cur', i === cur);\n      el.querySelector('.hp i').style.width = t.hp + '%';\n      el.querySelector('.hp').classList.toggle('low', t.hp <= 40);\n      el.querySelector('.crack').style.opacity = t.hp < 75 ? (100 - t.hp) / 70 : 0;\n      el.classList.toggle('dmg', t.hp <= 40);\n      el.querySelector('.cr').textContent = `👑 ${t.crowns}  ·  ❤ ${t.hp}`;\n    });\n    const t = teams[cur];\n    G.$('#info').innerHTML = `Giliran <span style=\"color:${t.color}\">${t.emoji} ${t.name}<\/span>`;\n    G.$('#left').textContent = `Soalan ${Math.min(asked + 1, opt.q)} / ${opt.q}`;\n    G.$('#go').disabled = busy;\n  }\n\n  function throwRock(from, to) {\n    return new Promise(res => {\n      const a = G.$('#c' + from).getBoundingClientRect(), b = G.$('#c' + to).getBoundingClientRect();\n      const r = G.h('<div class=\"rock\">🪨<\/div>'); document.body.appendChild(r);\n      const x0 = a.left + a.width / 2 - 22, y0 = a.top + 20, x1 = b.left + b.width / 2 - 22, y1 = b.top + b.height * .35;\n      const peak = Math.min(y0, y1) - 180;\n      const anim = r.animate([\n        { transform: `translate(${x0}px,${y0}px) rotate(0deg)` },\n        { transform: `translate(${(x0 + x1) / 2}px,${peak}px) rotate(360deg)`, offset: .5 },\n        { transform: `translate(${x1}px,${y1}px) rotate(720deg)` }], { duration: 950, easing: 'ease-in-out' });\n      r.style.left = 0; r.style.top = 0;\n      anim.onfinish = () => { r.remove(); res(); };\n    });\n  }\n\n  G.$('#go').onclick = async () => {\n    if (busy) return; busy = true; paint();\n    const team = teams[cur];\n    const ok = await G.ask(deck.next(), { team, label: `Soalan ${asked + 1}/${opt.q}` });\n    asked++;\n    if (ok) {\n      const others = teams.map((t, i) => i).filter(i => i !== cur);\n      const act = await G.choose(`${team.emoji} ${team.name}: pilih tindakan`, [\n        { label: '🎯 Serang<br><small>−25 HP lawan<\/small>', value: 'atk', color: '#d64545' },\n        { label: `🔨 Baiki<br><small>+15 HP (kini ${team.hp})<\/small>`, value: 'fix', color: '#2a8a5a' }]);\n      if (act === 'fix') {\n        team.hp = Math.min(100, team.hp + 15); G.sfx.good(); G.burstAt(G.$('#c' + cur), ['🔨', '🧱', '✨'], 14);\n        G.toast(`${team.emoji} kubu dibaiki! ❤ ${team.hp}`);\n      } else {\n        const target = others.length === 1 ? others[0] : await G.pickTeam(teams, `🎯 Serang kubu siapa?`, cur);\n        await throwRock(cur, target);\n        const crit = Math.random() < .2, dmg = crit ? 40 : 25, tt = teams[target], el = G.$('#c' + target);\n        tt.hp = Math.max(0, tt.hp - dmg); G.sfx.boom(); G.shake(el); G.burstAt(el, ['💥', '🪨', '💨'], 16);\n        G.toast(crit ? `💥 KRITIKAL! −${dmg}` : `💥 −${dmg}`);\n        paint();\n        if (tt.hp <= 0) {\n          await G.sleep(500);\n          team.crowns++; el.querySelector('svg').style.o onnect(code, name) {\n  if (!window.Peer) { $('#err').textContent = 'Perlukan internet'; $('#go').disabled = false; return; }\n  if (peer) try { peer.destroy(); } catch (e) {}\n  peer = new Peer({ debug: 1 });\n  peer.on('open', () => {\n    conn = peer.connect(PREFIX + code.toLowerCase(), { reliable: true });\n    conn.on('open', () => { tries = 0; conn.send({ t: 'join', name }); });\n    conn.on('data', onData);\n    conn.on('close', () => lost(code, name));\n  });\n  peer.on('error', e => {\n    if (e.type === 'peer-unavailable') { $('#err').textContent = '❌ Kod bilik tidak dijumpai'; $('#go').disabled = false; show('join'); }\n    else lost(code, name);\n  });\n}\nfunction lost(code, name) {\n  if (phase === 'end') return;\n  if (tries++ < 5) { banner('🔌 Menyambung semula…'); setTimeout(() => connect(code, name), 1500); }\n  else { show('join'); $('#err').textContent = 'Sambungan terputus. Cuba sertai semula.'; $('#go').disabled = false; }\n}\nfunction show(which) { $('#s-join').style.display = which === 'join' ? '' : 'none'; $('#s-game').style.display = which === 'game' ? '' : 'none'; }\nfunction banner(t) { const b = $('#body'); if (b) b.insertAdjacentHTML('afterbegin', `<div class=\"stats\">${t}<\/div>`); }\n\nfunction onData(d) {\n  if (d.t === 'welcome') {\n    me = d; show('game');\n    document.documentElement.style.setProperty('--tc', d.teamInfo.color);\n    $('#band').innerHTML = `<span>${d.teamInfo.emoji}<\/span><span>${G.esc(d.teamInfo.name)}<\/span><span class=\"sp\"><\/span><span style=\"font-size:16px\">${G.esc(d.name)}<\/span>`;\n    if (d.phase === 'lobby') { phase = 'wait'; waitScreen(); }\n  } else if (d.t === 'start') {\n    qs = d.qs; deck = G.deck(qs); endsAt = Date.now() + d.remaining;\n    if (phase !== 'play') { phase = 'play'; nextQ(); }\n  } else if (d.t === 'state') {\n    const tugs = d.tugs || 3, p = Math.max(-1, Math.min(1, d.pos / tugs)); // -1 = left team (team 0) winning\n    const rope = $('#rope'); rope.style.setProperty('--l', x;flex-wrap:wrap;gap:12px;justify-content:center}\n.pickgrid button{background:var(--tc);color:#fff;font-size:22px;font-weight:800;padding:14px 22px;border-radius:16px;min-width:160px}\n\n/* winner */\n.winner{text-align:center}\n.winner .crown{font-size:90px;animation:bob 1s infinite alternate}\n@keyframes bob{to{transform:translateY(-10px) rotate(6deg)}}\n.winner h2{font-size:44px;margin:0}\n.rank{max-width:520px;margin:16px auto;text-align:left}\n.rank div{display:flex;gap:10px;padding:8px 14px;border-radius:12px;background:var(--panel);margin:6px 0;font-size:20px;font-weight:700}\n.rank div span:nth-child(2){flex:1}\n\n/* toast + burst */\n.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#000c;padding:10px 24px;border-radius:99px;font-size:24px;font-weight:800;z-index:200;animation:toast 1.8s forwards;pointer-events:none;white-space:nowrap}\n@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}\n.burst{position:fixed;pointer-events:none;font-size:30px;z-index:300;animation:burst 1.1s ease-out forwards}\n@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}\n.shake{animation:shake .45s}\n@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}\n\n@media (max-width:640px){\n  .opts{grid-template-columns:1fr}\n  .setup{margin:16px;padding:18px}\n  .setup h1{font-size:30px}\n}\n", "common.js": "/* Shared engine for all classroom game templates.\n   - Question bank: imported from BlastRoom-style xlsx/csv (also Blooket / Kahoot layouts), saved in localStorage\n   - Teams, question overlay, pickers, sounds, effects */\nconst G = (() => {\n  const LS_KEY = 'cg_qset_v1';\n  const LS_SET = 'cg_settings_v1';\n\n  const TEAMS = [\n    { name: 'Harimau', emoji: '🐯', color: '#f4a259' },\n    { name: 'Helang',  emoji: '🦅', color: '#4ea8de' },\n    { name: 'Gajah',   emoji: '🐘', color: '#9b5de5' },\n    { name: 'Penyu',   emoji: '🐢', color: '#2ec4b6' },\n    { name: 'Kancil',  emoji: '🦌', color: '#f15bb5' },\n    { name: 'Badak',   emoji: '🦏', color: '#90be6d' },\n  ];\n\n  const SAMPLE = {\n    title: 'Contoh: Peribahasa (Demo)',\n    questions: [\n      ['Maksud \"bagai aur dengan tebing\":', 'saling membantu', ['saling bermusuhan', 'hidup bersendirian', 'sangat kaya']],\n      ['Maksud \"ringan tulang\":', 'rajin bekerja', ['malas', 'kurus', 'lemah badan']],\n      ['Maksud \"kaki bangku\":', 'tidak pandai bermain bola', ['suka duduk', 'kaki yang patah', 'tukang kayu']],\n      ['Maksud \"buah hati\":', 'orang yang dikasihi', ['buah yang manis', 'jantung', 'hadiah']],\n      ['Maksud \"bagai menatang minyak yang penuh\":', 'menjaga dengan penuh kasih sayang', ['membazir minyak', 'bekerja dengan cuai', 'berniaga minyak']],\n      ['Maksud \"besar kepala\":', 'sombong', ['bijak', 'sakit kepala', 'pemimpin']],\n      ['Maksud \"cakar ayam\":', 'tulisan yang buruk', ['makanan ayam', 'jalan berliku', 'lukisan cantik']],\n      ['\"Air dicincang tidak akan putus\" bermaksud:', 'pertalian keluarga sukar diputuskan', ['air sukar dipotong', 'kerja sia-sia', 'tidak mahu mengalah']],\n      ['Maksud \"kaki ayam\":', 'tidak berkasut', ['kaki yang kecil', 'suka berjalan', 'penakut']],\n      ['Maksud \"panjang tangan\":', 'suka mencuri', ['pemurah', 'tinggi', 'rajin menolong']],\n      ['Maksud \"mulut murai\":', 'suka bercakap banyak', ['suka menyanyi', 'pendiam', 'pandai berpidato']],\n      ['\"Seperti katak di bawah tempurung\" bermaksud:', 'berpengetahuan sempit', ['suka bersembunyi', 'takut hujan', 'hidup susah']],\n      ['Lengkapkan: \"Hati gajah sama dilapah, hati kuman sama ___\"', 'dicecah', []],\n      ['Betul atau Salah: \"Bulat air kerana pembetung, bulat manusia kerana muafakat.\"', 'True', ['False']],\n    ].map(([q, c, w]) => ({ q, correct: [c], wrong: w, points: 10, time: 30 })),\n  };\n\n  // ---------- storage ----------\n  function loadSet() {\n    try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.questions && s.questions.length) return s; } catch (e) {}\n    return SAMPLE;\n  }\n  function saveSet(set) { try { localStorage.setItem(LS_KEY, JSON.stringify(set)); } catch (e) {} }\n  function clearSet() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }\n  function settings() {\n    let s = {}; try { s = JSON.parse(localStorage.getItem(LS_SET)) || {}; } catch (e) {}\n    return Object.assign({ timer: true, sound: true }, s);\n  }\n  function saveSettings(s) { try { localStorage.setItem(LS_SET, JSON.stringify(s)); } catch (e) {} }\n\n  // ---------- import ----------\n  const norm = s => String(s ?? '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');\n  const cell = v => (v === undefined || v === null) ? '' : String(v).trim();\n\n  /** rows: array of arrays (first sheet). Returns {questions, skipped, format} */\n  function parseRows(rows) {\n    let h = rows.findIndex(r => r && r.some(c => /^question/.test(norm(c))));\n    if (h < 0) throw new Error('Tidak jumpa lajur \"question\". Guna templat BlastRoom / Blooket / Kahoot.');\n    const cols = rows[h].map(norm);\n    const qCol = cols.findIndex(c => /^question/.test(c));\n    const ptsCol = cols.findIndex(c => /^points?$/.test(c));\n    const timeCol = cols.findIndex(c => /time/.test(c));\n    const out = []; let skipped = 0; let format;\n\n    const cCol = cols.indexOf('correct_answer');\n    const wCols = cols.map((c, i) => /^wrong_answer/.test(c) ? i : -1).filter(i => i >= 0);\n    const aCols = cols.map((c, i) => /^answer_?\\d/.test(c) ? i : -1).filter(i => i >= 0);\n    const ciCol = cols.findIndex(c => /^correct/.test(c) && c !== 'correct_answer');\n\n    for (const r of rows.slice(h + 1)) {\n      if (!r) continue;\n      const q = cell(r[qCol]);\n      if (!q) continue;\n      let correct = [], wrong = [];\n      if (cCol >= 0) {                       // BlastRoom: question | correct_answer | wrong_answer_1..3\n        format = 'BlastRoom';\n        const ci = ciCol >= 0 ? cell(r[ciCol]) : '';\n        if (/^[\\d,\\s]+$/.test(ci) && ci.trim()) {\n          // BlastRoom: \"correct_answers\" (1-based indices, e.g. \"1,3\") overrides headers;\n          // correct_answer + wrong_answer_1..3 are then treated as answers 1..4\n          const idx = ci.split(/[,\\s]+/).map(Number).filter(n => n >= 1);\n          [cCol, ...wCols].forEach((c, i) => { const a = cell(r[c]); if (a) (idx.includes(i + 1) ? correct : wrong).push(a); });\n        } else {\n          if (cell(r[cCol])) correct.push(cell(r[cCol]));\n          wCols.forEach(i => cell(r[i]) && wrong.push(cell(r[i])));\n        }\n      } else if (aCols.length) {             // Blooket / Kahoot: Answer 1..4 + Correct Answer(s) as numbers\n        format = 'Blooket/Kahoot';\n        const answers = aCols.map(i => cell(r[i]));\n        const idx = cell(r[ciCol]).split(/[,;\\s]+/).map(Number).filter(n => n >= 1);\n        answers.forEach((a, i) => { if (!a) return; (idx.includes(i + 1) ? correct : wrong).push(a); });\n      }\n      if (!correct.length) { skipped++; continue; }\n      const pts = Number(cell(r[ptsCol])) || 15;\n      const time = Number(cell(r[timeCol])) || 20;\n      out.push({ q, correct, wrong, points: pts, time });\n    }\n    return { questions: out, skipped, format: format || '?' };\n  }\n\n  async function importFile(file) {\n    if (!window.XLSX) throw new Error('Pustaka XLSX belum dimuatkan (perlukan internet).');\n    const buf = await file.arrayBuffer();\n    const wb = XLSX.read(buf, { type: 'array' });\n    const ws = wb.Sheets[wb.SheetNames[0]];\n    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' });\n    const res = parseRows(rows);\n    if (!res.questions.length) throw new Error('Tiada soalan sah dijumpai dalam fail ini.');\n    const set = { title: file.name.replace(/\\.(xlsx|xls|csv)$/i, ''), questions: res.questions };\n    saveSet(set);\n    return Object.assign(res, { set });\n  }\n\n  function downloadTemplate() {\n    const rows = [\n      ['Templat Soalan (serasi BlastRoom)'], [],\n      ['Isi satu soalan setiap baris. Kosongkan wrong_answer untuk soalan isi tempat kosong. True/False: correct_answer = True, wrong_answer_1 = False.'],\n      ['question', 'correct_answer', 'wrong_answer_1', 'wrong_answer_2', 'wrong_answer_3', 'points', 'time_limit'],\n      ['Maksud \"ringan tulang\":', 'rajin bekerja', 'malas', 'kurus', 'lemah badan', 10, 20],\n      ['Lengkapkan: \"Hati gajah sama dilapah, hati kuman sama ___\"', 'dicecah', '', '', '', 10, 30],\n      ['Betul atau Salah: Bahasa Melayu ialah bahasa kebangsaan Malaysia.', 'True', 'False', '', '', 10, 15],\n    ];\n    const ws = XLSX.utils.aoa_to_sheet(rows);\n    ws['!cols'] = [{ wch: 50 }, { wch: 24 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 8 }, { wch: 10 }];\n    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Questions');\n    XLSX.writeFile(wb, 'templat_soalan.xlsx');\n  }\n\n  // ---------- helpers ----------\n  const $ = (s, el = document) => el.querySelector(s);\n  const esc = s => String(s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  // supports BlastRoom-style H~2~O and x^2^, plus **bold** and *italic*\n  const fmt = s => esc(s).replace(/~([^~]+)~/g, '<sub>$1<\/sub>').replace(/\\^([^^]+)\\^/g, '<sup>$1<\/sup>')\n    .replace(/\\*\\*([^*]+)\\*\\*/g, '<b>$1<\/b>').replace(/\\*([^*]+)\\*/g, '<i>$1<\/i>');\n  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };\n  const sleep = ms => new Promise(r => setTimeout(r, ms));\n  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));\n  function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }\n\n  function deck(questions) {\n    let pool = [], n = 0;\n    return { next() { if (!pool.length) pool = shuffle(questions); n++; return pool.pop(); }, get count() { return n; } };\n  }\n\n  function makeTeams(n) { return TEAMS.slice(0, n).map((t, i) => Object.assign({ id: i, score: 0 }, t)); }\n\n  // ---------- sound ----------\n  let ac;\n  function tone(freqs, dur = .12, type = 'square', vol = .06) {\n    if (!settings().sound) return;\n    try {\n      ac = ac || new (window.AudioContext || window.webkitAudioContext)();\n      let t = ac.currentTime;\n      freqs.forEach(f => {\n        const o = ac.createOscillator(), g = ac.createGain();\n        o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur); t += dur * .8;\n      });\n    } catch (e) {}\n  }\n  const sfx = {\n    click: () => tone([660], .05),\n    good: () => tone([523, 659, 784, 1046], .1, 'triangle', .09),\n    bad: () => tone([300, 200], .2, 'sawtooth', .05),\n    boom: () => tone([120, 90, 60, 40], .18, 'sawtooth', .1),\n    tick: () => tone([1200], .03, 'sine', .04),\n    win: () => tone([523, 659, 784, 659, 784, 1046], .14, 'triangle', .1),\n  };\n\n  // ---------- effects ----------\n  function toast(msg) { const t = h(`<div class=\"toast\">${msg}<\/div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 1900); }\n  function burst(x, y, emojis = ['🎉', '⭐', '✨', '🎊'], n = 18) {\n    for (let i = 0; i < n; i++) {\n      const e = h(`<div class=\"burst\">${emojis[i % emojis.length]}<\/div>`);\n      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 180;\n      e.style.left = x + 'px'; e.style.top = y + 'px';\n      e.style.setProperty('--dx', Math.cos(a) * d + 'px'); e.style.setProperty('--dy', Math.sin(a) * d + 'px');\n      e.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');\n      document.body.appendChild(e); setTimeout(() => e.remove(), 1200);\n    }\n  }\n  function burstAt(el, emojis, n) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, emojis, n); }\n  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }\n\n  // ---------- overlay ----------\n  function overlay(inner) {\n    const ov = h(`<div class=\"qov\"><div class=\"qcard\"><\/div><\/div>`);\n    ov.firstChild.appendChild(typeof inner === 'string' ? h(`<div>${inner}<\/div>`) : inner);\n    document.body.appendChild(ov); return ov;\n  }\n\n  function buildOptions(q) {\n    if (!q.wrong.length) return null; // open/blank question\n    return shuffle([...q.correct.slice(0, 1), ...q.wrong]).slice(0, 6);\n  }\n\n  /** Teacher-led: one team answers. Teacher clicks the option the team chose.\n      Resolves true/false. opts: {team, label, points} */\n  function ask(q, { team, label = '', points } = {}) {\n    return new Promise(resolve => {\n      const st = settings();\n      const options = buildOptions(q);\n      const card = h(`<div>\n        <div class=\"qhead\">${team ? `<span class=\"who\" style=\"--tc:${team.color}\">${team.emoji} ${esc(team.name)}<\/span>` : ''}\n          <span>${esc(label)}<\/span><span class=\"sp\"><\/span>${points ? `<span class=\"pts\">${points} mata<\/span>` : ''}<span class=\"tm\"><\/span><\/div>\n        ${st.timer ? '<div class=\"tbar\"><i><\/i><\/div>' : ''}\n        <div class=\"qtext\">${fmt(q.q)}<\/div>\n        ${options ? `<div class=\"opts\">${options.map((o, i) => `<button class=\"opt\" data-i=\"${i}\"><span class=\"k\">${'ABCDEF'[i]}<\/span><span>${fmt(o)}<\/span><\/button>`).join('')}<\/div>`\n                  : `<div class=\"answerbox\" style=\"display:none\">${q.correct.map(fmt).join(' / ')}<\/div>`}\n        <div class=\"qfoot\">${options ? '<span style=\"color:var(--muted)\">Klik jawapan pasukan (atau tekan 1–4)<\/span>' : '<button class=\"btn gold big rev\">Tunjuk Jawapan<\/button>'}<\/div>\n      <\/div>`);\n      const ov = overlay(card);\n      let done = false, timerId;\n      const bar = card.querySelector('.tbar i'), tm = card.querySelector('.tm');\n      const total = (q.time || 30) * 1000, t0 = performance.now();\n      if (st.timer) {\n        timerId = setInterval(() => {\n          const left = Math.max(0, total - (performance.now() - t0));\n          bar.style.transform = `scaleX(${left / total})`; tm.textContent = Math.ceil(left / 1000) + 's';\n          if (left <= 0) { clearInterval(timerId); finish(false, null, true); }\n        }, 100);\n      }\n      const foot = card.querySelector('.qfoot');\n      function finish(ok, pickedEl, timeout) {\n        if (done) return; done = true; clearInterval(timerId);\n        if (options) card.querySelectorAll('.opt').forEach(b => {\n          const right = q.correct.includes(options[b.dataset.i]);\n          b.classList.toggle('right', right); if (!right && b !== pickedEl) b.classList.add('dim');\n          if (b === pickedEl && !right) b.classList.add('picked-wrong');\n        });\n        else card.querySelector('.answerbox').style.display = 'block';\n        ok ? sfx.good() : sfx.bad();\n        foot.innerHTML = `<span class=\"verdict ${ok ? 'ok' : 'no'}\">${ok ? '✔ Betul!' : timeout ? '⏰ Masa tamat!' : '✘ Salah'}<\/span>\n          <button class=\"btn big gold cont\">Teruskan ➜<\/button>`;\n        if (ok) burstAt(card.querySelector('.qtext'));\n        foot.querySelector('.cont').onclick = () => close(ok);\n      }\n      function close(ok) { document.removeEventListener('keydown', key); ov.remove(); resolve(ok); }\n      if (options) card.querySelectorAll('.opt').forEach(b => b.onclick = () => finish(q.correct.includes(options[b.dataset.i]), b));\n      else foot.querySelector('.rev').onclick = () => {\n        clearInterval(timerId); card.querySelector('.answerbox').style.display = 'block';\n        foot.innerHTML = `<button class=\"btn big teal ok\">✔ Betul<\/button><button class=\"btn big coral no\">✘ Salah<\/button>`;\n        foot.querySelector('.ok').onclick = () => { done = false; finish(true); };\n        foot.querySelector('.no').onclick = () => { done = false; finish(false); };\n        done = true; // stop timer from firing\n      };\n      function key(e) {\n        if (!done && options && /^[1-6]$/.test(e.key)) { const b = card.querySelectorAll('.opt')[+e.key - 1]; b && b.click(); }\n        if (!done && options && /^[a-fA-F]$/.test(e.key)) { const b = card.querySelectorAll('.opt')['abcdef'.indexOf(e.key.toLowerCase())]; b && b.click(); }\n        if (e.key === 'Enter') { const c = foot.querySelector('.cont'); c && c.click(); }\n      }\n      document.addEventListener('keydown', key);\n    });\n  }\n\n  /** Buzzer style: question shown to everyone, teacher picks which team got it first.\n      Resolves team index or -1. */\n  function askContest(q, teams, { label = '' } = {}) {\n    return new Promise(resolve => {\n      const options = buildOptions(q);\n      const card = h(`<div>\n        <div class=\"qhead\"><span>${esc(label)}<\/span><span class=\"sp\"><\/span><\/div>\n        <div class=\"qtext\">${fmt(q.q)}<\/div>\n        ${options ? `<div class=\"opts static\">${options.map((o, i) => `<div class=\"opt\" data-i=\"${i}\"><span class=\"k\">${'ABCDEF'[i]}<\/span><span>${fmt(o)}<\/span><\/div>`).join('')}<\/div>`\n                  : `<div class=\"answerbox\" style=\"display:none\">${q.correct.map(fmt).join(' / ')}<\/div>`}\n        <div class=\"qfoot\"><button class=\"btn gold rev\">👁 Tunjuk Jawapan<\/button><\/div>\n        <div class=\"mtitle\" style=\"font-size:20px;margin:14px 0 8px;color:var(--muted)\">Siapa jawab betul dahulu?<\/div>\n        <div class=\"pickgrid\">${teams.map((t, i) => `<button data-t=\"${i}\" style=\"--tc:${t.color}\">${t.emoji} ${esc(t.name)}<\/button>`).join('')}\n          <button data-t=\"-1\" style=\"--tc:#555\">Tiada<\/button><\/div>\n      <\/div>`);\n      const ov = overlay(card);\n      card.querySelector('.rev').onclick = () => {\n        if (options) card.querySelectorAll('.opt').forEach(b => q.correct.includes(options[b.dataset.i]) ? b.classList.add('right') : b.classList.add('dim'));\n        else card.querySelector('.answerbox').style.display = 'block';\n      };\n      card.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = +b.dataset.t; t >= 0 ? sfx.good() : sfx.bad(); ov.remove(); resolve(t); });\n    });\n  }\n\n  /** choose a team from list. resolves index into `teams` */\n  function pickTeam(teams, title, exclude = -1) {\n    return new Promise(resolve => {\n      const card = h(`<div><div class=\"mtitle\">${title}<\/div><div class=\"pickgrid\">\n        ${teams.map((t, i) => i === exclude ? '' : `<button data-t=\"${i}\" style=\"--tc:${t.color}\">${t.emoji} ${esc(t.name)}<br><small>${t.score} mata<\/small><\/button>`).join('')}\n      <\/div><\/div>`);\n      const ov = overlay(card);\n      card.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { ov.remove(); resolve(+b.dataset.t); });\n    });\n  }\n\n  function choose(title, choices) { // choices: [{label, value, cls}]\n    return new Promise(resolve => {\n      const card = h(`<div><div class=\"mtitle\">${title}<\/div><div class=\"pickgrid\">\n        ${choices.map((c, i) => `<button data-i=\"${i}\" style=\"--tc:${c.color || '#335'}\">${c.label}<\/button>`).join('')}<\/div><\/div>`);\n      const ov = overlay(card);\n      card.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { ov.remove(); resolve(choices[+b.dataset.i].value); });\n    });\n  }\n\n  function message(html, btn = 'OK') {\n    return new Promise(resolve => {\n      const card = h(`<div style=\"text-align:center\"><div style=\"font-size:26px;font-weight:700;margin:10px 0 20px\">${html}<\/div><button class=\"btn gold big\">${btn}<\/button><\/div>`);\n      const ov = overlay(card); card.querySelector('button').onclick = () => { ov.remove(); resolve(); };\n    });\n  }\n\n  function winner(teams, extra = t => `${t.score} mata`, sortFn = (a, b) => b.score - a.score) {\n    const ranked = teams.slice().sort(sortFn);\n    const w = ranked[0];\n    const tie = ranked[1] && sortFn(ranked[0], ranked[1]) === 0;\n    sfx.win();\n    const card = h(`<div class=\"winner\">\n      <div class=\"crown\">${tie ? '🤝' : '👑'}<\/div>\n      <h2>${tie ? 'Seri!' : `${w.emoji} ${esc(w.name)} menang!`}<\/h2>\n      <div class=\"rank\">${ranked.map((t, i) => `<div style=\"border-left:6px solid ${t.color}\"><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'}<\/span><span>${t.emoji} ${esc(t.name)}<\/span><span>${extra(t)}<\/span><\/div>`).join('')}<\/div>\n      <div class=\"qfoot\"><button class=\"btn big gold again\">🔁 Main Lagi<\/button><a class=\"btn big\" href=\"index.html\">🏠 Menu<\/a><\/div><\/div>`);\n    overlay(card);\n    card.querySelector('.again').onclick = () => location.reload();\n    setTimeout(() => { burst(innerWidth / 2, innerHeight / 3, ['🎉', '🏆', '⭐', '🎊'], 40); }, 200);\n  }\n\n  // ---------- scoreboard ----------\n  function renderTeams(el, teams, cur, badge = () => '') {\n    el.innerHTML = teams.map((t, i) => `<div class=\"team ${i === cur ? 'cur' : ''}\" style=\"--tc:${t.color}\" data-i=\"${i}\">\n      <span class=\"em\">${t.emoji}<\/span><span class=\"nm\">${esc(t.name)} ${badge(t)}<\/span>\n      <span class=\"adj\"><button data-d=\"-5\">−<\/button><button data-d=\"5\">+<\/button><\/span>\n      <span class=\"sc\">${t.score}<\/span><\/div>`).join('');\n    el.querySelectorAll('.adj button').forEach(b => b.onclick = () => {\n      const t = teams[+b.closest('.team').dataset.i]; t.score += +b.dataset.d; renderTeams(el, teams, cur, badge);\n    });\n  }\n\n  // ---------- setup screen ----------\n  /** cfg: {title, desc, tags:[], options:[{key,label,choices:[{v,label,sub}],def}], onStart(values)} */\n  function setup(root, cfg) {\n    const set = loadSet();\n    const vals = {};\n    const el = h(`<div class=\"setup\">\n      <h1>${cfg.icon || ''} ${cfg.title}<\/h1>\n      <div class=\"desc\">${cfg.desc}<\/div>\n      <div>${(cfg.tags || []).map(t => `<span class=\"tag\">${t}<\/span>`).join('')}<\/div>\n      ${cfg.options.map(o => `<h3>${o.label}<\/h3><div class=\"chips\" data-k=\"${o.key}\">\n        ${o.choices.map(c => `<button class=\"chip\" data-v=\"${c.v}\">${c.label}${c.sub ? `<small>${c.sub}<\/small>` : ''}<\/button>`).join('')}<\/div>`).join('')}\n      <div class=\"qinfo\">📚 Set soalan: <b>${esc(set.title)}<\/b> — ${set.questions.length} soalan. <a href=\"index.html\">Tukar set<\/a><\/div>\n      <div class=\"go\"><button class=\"btn gold big start\">Mula ▶<\/button><\/div><\/div>`);\n    root.appendChild(el);\n    cfg.options.forEach(o => {\n      vals[o.key] = o.def;\n      const box = el.querySelector(`[data-k=\"${o.key}\"]`);\n      const paint = () => box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', String(vals[o.key]) === c.dataset.v));\n      box.querySelectorAll('.chip').forEach(c => c.onclick = () => { vals[o.key] = isNaN(+c.dataset.v) ? c.dataset.v : +c.dataset.v; paint(); sfx.click(); });\n      paint();\n    });\n    el.querySelector('.start').onclick = () => { el.remove(); cfg.onStart(vals, set); };\n  }\n\n  return { TEAMS, SAMPLE, loadSet, saveSet, clearSet, settings, saveSettings, parseRows, importFile, downloadTemplate,\n    $, esc, fmt, shuffle, sleep, rand, h, deck, makeTeams, sfx, toast, burst, burstAt, shake,\n    overlay, ask, askContest, pickTeam, choose, message, winner, renderTeams, setup };\n})();\n", "tug.css": "body{background:linear-gradient(180deg,#7cc6f0 0%,#bfe6f8 50%,#78c060 50.1%,#4e9a3e 100%);background-attachment:fixed}\n.tugwrap{max-width:1300px;margin:0 auto;padding:16px}\n.scores{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}\n.ts{background:var(--tc);border-radius:18px;padding:8px 22px;font-size:26px;font-weight:800;box-shadow:0 6px 0 #0003;display:flex;gap:10px;align-items:center}\n.ts small{font-size:16px;opacity:.85}\n.vs{font-size:30px;font-weight:800;color:#1a2040}\n.stage{position:relative;height:300px;margin:26px 0 10px;overflow:hidden}\n.mud{position:absolute;left:50%;bottom:22px;width:150px;height:46px;transform:translateX(-50%);background:radial-gradient(ellipse at center,#6b4423 0%,#4a2e14 70%,transparent 72%);border-radius:50%}\n.mark{position:absolute;bottom:20px;width:6px;height:60px;background:#fff9;border-radius:4px}\n.rig{position:absolute;left:50%;bottom:52px;width:0;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}\n.rope{position:absolute;bottom:58px;left:-46vw;width:92vw;max-width:none;height:10px;background:repeating-linear-gradient(60deg,#c8a165 0 10px,#a07a40 10px 20px);border-radius:6px;box-shadow:0 3px 0 #0003}\n.flag{position:absolute;bottom:40px;left:-10px;width:20px;height:44px;background:#e63946;clip-path:polygon(0 0,100% 0,50% 100%);}\n.side{position:absolute;bottom:0;display:flex;gap:6px;font-size:58px;line-height:1}\n.side.l{right:120px;flex-direction:row}\n.side.r{left:120px;flex-direction:row-reverse}\n.side span{display:inline-block;animation:pull .5s infinite alternate}\n.side.l span{transform-origin:bottom center}\n.side span:nth-child(2n){animation-delay:.15s}\n@keyframes pull{from{transform:rotate(-8deg)}to{transform:rotate(-16deg) translateX(-4px)}}\n.side.r span{animation-name:pullr}\n@keyframes pullr{from{transform:rotate(8deg)}to{transform:rotate(16deg) translateX(4px)}}\n.side .tagname{position:absolute;bottom:-34px;font-size:18px;font-weight:800;background:var(--tc);color:#fff;padding:2px 12px;border-radius:99px;white-space:nowrap}\n.side.l .tagname{right:0}.side.r .tagname{left:0}\n.splash{position:absolute;left:50%;bottom:40px;font-size:70px;transform:translateX(-50%);animation:spl 1.2s forwards}\n@keyframes spl{0%{opacity:0;transform:translate(-50%,20px) scale(.4)}30%{opacity:1;transform:translate(-50%,-30px) scale(1.3)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}\n.panel{max-width:900px;margin:30px auto 0;background:#0b1a3acc;border-radius:22px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#fff}\n.panel .info{flex:1;font-size:22px;font-weight:800}\n@media (max-width:700px){.side{font-size:34px}.side.l{right:70px}.side.r{left:70px}.stage{height:220px}}\n", "tug.js": "/* Tug-of-war stage shared by tug.html (projector) and tug-host.html (live).\n   pos: negative = left team winning, positive = right team. |pos| = steps means win. */\nfunction TugStage(el, teams, steps, people = 4) {\n  const ppl = (t, n) => Array(n).fill(`<span>${t.emoji}<\/span>`).join('');\n  el.innerHTML = `<div class=\"stage\">\n    <div class=\"mark\" style=\"left:calc(50% - 3px - 32%)\"><\/div><div class=\"mark\" style=\"left:calc(50% - 3px + 32%)\"><\/div>\n    <div class=\"mud\"><\/div>\n    <div class=\"rig\"><div class=\"rope\"><\/div><div class=\"flag\"><\/div>\n      <div class=\"side l\" style=\"--tc:${teams[0].color}\">${ppl(teams[0], people)}<div class=\"tagname\">${teams[0].name}<\/div><\/div>\n      <div class=\"side r\" style=\"--tc:${teams[1].color}\">${ppl(teams[1], people)}<div class=\"tagname\">${teams[1].name}<\/div><\/div>\n    <\/div><\/div>`;\n  const stage = el.querySelector('.stage'), rig = el.querySelector('.rig');\n  let steps_ = steps;\n  function set(pos) {\n    const max = stage.clientWidth * 0.32; // marks at ±32%\n    const p = Math.max(-steps_, Math.min(steps_, pos));\n    rig.style.transform = `translateX(${(p / steps_) * max}px)`;\n  }\n  function splash(w) {\n    G.sfx.boom();\n    const s = G.h(`<div class=\"splash\">💦🟤💦<\/div>`); stage.appendChild(s); setTimeout(() => s.remove(), 1300);\n    G.burstAt(stage.querySelector(w === 0 ? '.side.l' : '.side.r'), ['🎉', '⭐', teams[w].emoji], 26);\n  }\n  window.addEventListener('resize', () => set(G._tugPos || 0));\n  return { set: p => { G._tugPos = p; set(p); }, splash, setSteps: n => { steps_ = n; } };\n}\n"};
var f = document.getElementById('f');

}
